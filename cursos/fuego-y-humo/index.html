    '<div class="campos"><div><label for="fNom">Nombre completo</label><input type="text" id="fNom" maxlength="80" autocomplete="name"></div>' +
    '<div><label for="fEmp">Número de empleado</label><input type="text" id="fEmp" maxlength="20" inputmode="numeric"></div>' +
    '<div><label for="fPue">Puesto</label><input type="text" id="fPue" maxlength="60" placeholder="Por ejemplo: enfermera general"></div>' +
    '<div><label for="fAre">Área o servicio</label><input type="text" id="fAre" maxlength="60" placeholder="Por ejemplo: Urgencias"></div></div>' +
    '<p class="aviso">Estos datos solo aparecen en su constancia. No escriba información de pacientes.</p><p class="error" id="err" role="alert"></p>' +
    '<div class="acc"><button class="btn btn-p" id="bIni">Comenzar el curso</button></div></div>';
  h += '<div class="card"><p class="tenue" style="margin:0">¿Tiene un archivo de respaldo de otro equipo? <button class="btn btn-s" id="bCarg" style="min-height:40px;padding:.4rem .9rem;margin-left:.4rem">Cargar respaldo</button></p></div>';
  app().innerHTML = h;
  $("#bCarg").onclick = cargarRespaldo;
  if (previo) {
    $("#bCont").onclick = () => { S = previo; render(); arriba(); };
    $("#bOtro").onclick = () => confirmar("Se borrará el avance guardado de " + esc(previo.nombre) + ". ¿Desea continuar?", "Borrar y empezar", () => { try { localStorage.removeItem(CLAVE_GUARDADO); } catch (e) { /* sin acción */ } render(); });
  } else {
    $("#bIni").onclick = () => {
      const v = (id) => $(id).value.trim().replace(/\s+/g, " ");
      const d = { nombre: v("#fNom"), empleado: v("#fEmp"), puesto: v("#fPue"), area: v("#fAre") };
      if (d.nombre.length < 5) return ($("#err").textContent = "Escriba su nombre completo.", $("#fNom").focus());
      if (!d.puesto || !d.area) return ($("#err").textContent = "Escriba su puesto y su área o servicio.", (d.puesto ? $("#fAre") : $("#fPue")).focus());
      S = nuevo(d); guardar(); render(); arriba();
    };
  }
}

function pMenu() {
  const todos = hechos() === MODULOS.length;
  let h = '<div class="card"><div class="kicker">' + esc(CURSO.titulo) + ' · ' + CURSO.corta + '</div><h1>Hola, ' + esc(S.nombre.split(" ")[0]) + '</h1><p class="tenue" style="margin:0">Realice los módulos en orden. Cuando termine los ' + MODULOS.length + ', se habilita la evaluación final.</p></div><div class="mods" style="margin-top:1rem">';
  MODULOS.forEach((m, i) => {
    const st = S.mods[m.id]; const bloq = i > 0 && !(S.mods[MODULOS[i - 1].id] && S.mods[MODULOS[i - 1].id].hecho);
    const estado = st && st.hecho ? '<span class="estado e-ok">Completado</span>' : (bloq ? '<span class="estado e-no">Disponible al terminar el módulo ' + (i) + '</span>' : (st && st.pag ? '<span class="estado e-cur">En curso</span>' : '<span class="estado e-cur">Pendiente</span>'));
    h += '<div class="mod' + (st && st.hecho ? " hecho" : "") + (bloq ? " bloq" : "") + '"><div class="n">' + (st && st.hecho ? "✓" : m.id) + '</div><div class="info"><b>' + esc(m.titulo) + '</b><small>' + m.min + ' minutos</small><br>' + estado + '</div>' +
      (bloq ? "" : '<button class="btn ' + (st && st.hecho ? "btn-s" : "btn-p") + '" data-m="' + m.id + '">' + (st && st.hecho ? "Repasar" : (st && st.pag ? "Continuar" : "Iniciar")) + '</button>') + '</div>';
  });
  const ev = S.ev;
  h += '<div class="mod' + (ev.aprobado ? " hecho" : "") + (todos ? "" : " bloq") + '"><div class="n">' + (ev.aprobado ? "✓" : "★") + '</div><div class="info"><b>Evaluación final</b><small>' + EVALUACION.length + ' preguntas · aprobación ' + CURSO.aprobacion + ' %</small><br>' +
    (ev.aprobado ? '<span class="estado e-ok">Aprobada · ' + ev.cal + ' %</span>' : (todos ? '<span class="estado e-cur">' + (ev.intentos.length ? "Intentos: " + ev.intentos.length : "Disponible") + '</span>' : '<span class="estado e-no">Disponible al terminar los ' + MODULOS.length + ' módulos</span>')) + '</div>' +
    (ev.aprobado ? '<button class="btn btn-v" id="bComp">Ver constancia</button>' : (todos ? '<button class="btn btn-p" id="bEv">' + (ev.actual ? "Continuar" : "Presentar") + '</button>' : "")) + '</div></div>';
  h += '<div class="acc no-imp"><button class="btn btn-s" id="bResp">Descargar respaldo</button><button class="btn btn-s" id="bCarg">Cargar respaldo</button><button class="btn btn-x der" id="bReset">Reiniciar curso</button></div>';
  app().innerHTML = h;
  app().querySelectorAll("[data-m]").forEach((b) => b.onclick = () => { const st = M(+b.dataset.m); if (st.hecho) st.pag = 0; ir("modulo", { mid: +b.dataset.m }); });
  if ($("#bEv")) $("#bEv").onclick = () => ir("evaluacion");
  if ($("#bComp")) $("#bComp").onclick = () => ir("comprobante");
  $("#bResp").onclick = descargarRespaldo; $("#bCarg").onclick = cargarRespaldo;
  $("#bReset").onclick = () => confirmar("Se borrará todo su avance en este navegador. ¿Desea reiniciar el curso?", "Reiniciar", () => { try { localStorage.removeItem(CLAVE_GUARDADO); } catch (e) { /* sin acción */ } S = null; render(); arriba(); });
}

function bloque(b) {
  const [t, v, w] = b;
  if (t === "p") return "<p>" + fmt(v) + "</p>";
  if (t === "pasos") return '<ol class="pasos">' + v.map((x) => "<li>" + fmt(x) + "</li>").join("") + "</ol>";
  if (t === "reloj") return '<div class="reloj"><div><b>Práctica guiada</b><br>' + fmt(w) + '</div><div class="reloj-c"><span class="seg" data-s="' + v + '">' + v + ' s</span><button class="btn btn-p" data-reloj="' + v + '">Iniciar</button></div></div>';
  if (t === "lista") return '<ul class="lst">' + v.map((x) => "<li>" + fmt(x) + "</li>").join("") + "</ul>";
  if (t === "tabla") return '<table class="t' + (v.length > 2 ? " t3" : "") + '"><thead><tr>' + v.map((x) => "<th>" + esc(x) + "</th>").join("") + "</tr></thead><tbody>" + w.map((r) => "<tr>" + r.map((c, k) => '<td data-h="' + esc(v[k]) + '">' + fmt(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
  if (t === "nota") return '<div class="nota">' + fmt(v) + "</div>";
  if (t === "alerta") return '<div class="alerta">' + fmt(v) + "</div>";
  if (t === "pendiente") return '<div class="pend"><b>Pendiente de definición institucional:</b> ' + fmt(v) + "</div>";
  return "";
}
function pModulo() {
  const m = MODULOS.find((x) => x.id === S.mid); if (!m) return ir("menu");
  const st = M(m.id); const nL = m.paginas.length, nQ = m.repaso.length, total = nL + nQ + 1;
  const i = Math.min(st.pag, total - 1);
  let h = '<div class="card"><div class="kicker">Módulo ' + m.id + ' de ' + MODULOS.length + ' · ' + esc(m.titulo) + '</div>' +
    '<div class="pbar" style="margin:.3rem 0 1rem"><span style="width:' + Math.round((i + 1) / total * 100) + '%"></span></div>';
  let puede = true;
  if (i < nL) {
    const pg = m.paginas[i];
    if (i === 0) h += '<p class="tenue"><b>Objetivo:</b> ' + esc(m.objetivo) + '</p>';
    h += '<h2>' + esc(pg.t) + '</h2>' + pg.b.map(bloque).join("");
  } else if (i < nL + nQ) {
    const qi = i - nL, q = m.repaso[qi], r = st.resp[qi], ord = orden(q.ops.length, "r" + m.id + "-" + qi);
    const resp = r && r.listo;
    h += '<h2>Repaso ' + (qi + 1) + ' de ' + nQ + '</h2><div class="preg">' + esc(q.q) + '</div><div class="ops">' +
      ord.map((oi, k) => { let c = "op"; if (resp) { if (oi === 0) c += " bien"; else if (r.sel === oi) c += " mal"; } else if (r && r.sel === oi) c += " sel";
        return '<button class="' + c + '" data-o="' + oi + '"' + (resp ? " disabled" : "") + '><span class="l">' + LET[k] + '</span><span>' + esc(q.ops[oi]) + '</span></button>'; }).join("") + '</div>';
    if (resp) h += '<div class="fb ' + (r.sel === 0 ? "ok" : "no") + '" role="status"><b>' + (r.sel === 0 ? "¡Correcto! " : "La respuesta correcta es: " + esc(q.ops[0]) + ". ") + '</b>' + esc(q.exp) + '</div>';
    else { h += '<div class="acc"><button class="btn btn-p" id="bRev"' + (r && r.sel != null ? "" : " disabled") + '>Comprobar</button></div>'; puede = false; }
  } else {
    h += '<h2>¡Módulo completado!</h2><p>Terminó el módulo <b>' + esc(m.titulo) + '</b>.</p><ul class="lst"><li>' + m.paginas.map((p) => esc(p.t)).join("</li><li>") + '</li></ul>';
    if (!st.hecho) { st.hecho = true; st.fecha = new Date().toISOString(); guardar(); barra(); }
  }
  const ult = i === total - 1;
  h += '<div class="acc no-imp">' + (i > 0 ? '<button class="btn btn-s" id="bAnt">Anterior</button>' : "") +
    (ult ? '<button class="btn btn-p" id="bMenu">' + (MODULOS[m.id] && !(S.mods[m.id + 1] && S.mods[m.id + 1].hecho) ? "Ir al módulo " + (m.id + 1) : (hechos() === MODULOS.length && !S.ev.aprobado ? "Ir a la evaluación final" : "Volver al menú")) + '</button>'
      : '<button class="btn btn-p" id="bSig"' + (puede ? "" : " disabled") + '>Siguiente</button>') +
    '<button class="btn btn-s der" id="bSalir">Guardar y salir</button><span class="paso">Página ' + (i + 1) + ' de ' + total + '</span></div></div>';
  app().innerHTML = h;
  app().querySelectorAll(".op[data-o]").forEach((b) => b.onclick = () => { const qi = i - nL; st.resp[qi] = { sel: +b.dataset.o }; guardar(); render(); });
  if ($("#bRev")) $("#bRev").onclick = () => { st.resp[i - nL].listo = true; guardar(); render(); const f = app().querySelector(".fb"); if (f) f.scrollIntoView({ block: "nearest" }); };
  if ($("#bAnt")) $("#bAnt").onclick = () => { st.pag = i - 1; guardar(); render(); arriba(); };
  if ($("#bSig")) $("#bSig").onclick = () => { st.pag = i + 1; guardar(); render(); arriba(); };
  if ($("#bMenu")) $("#bMenu").onclick = () => {
    const sig = MODULOS[m.id];
    if (sig && !(S.mods[sig.id] && S.mods[sig.id].hecho)) ir("modulo", { mid: sig.id });
    else if (hechos() === MODULOS.length && !S.ev.aprobado) ir("evaluacion"); else ir("menu");
  };
  $("#bSalir").onclick = () => ir("menu");
  app().querySelectorAll("[data-reloj]").forEach((b) => b.onclick = () => iniciarReloj(b));
}

/** Cuenta regresiva para practicar la técnica (no se guarda). */
function iniciarReloj(b) {
  if (RELOJ) { clearInterval(RELOJ); RELOJ = null; }
  const caja = b.closest(".reloj"), seg = caja.querySelector(".seg"); let n = +b.dataset.reloj;
  app().querySelectorAll(".reloj").forEach((c) => c.classList.remove("fin", "corre"));
  caja.classList.add("corre"); b.textContent = "Reiniciar"; seg.textContent = n + " s";
  RELOJ = setInterval(() => { n -= 1; seg.textContent = n + " s";
    if (n <= 0) { clearInterval(RELOJ); RELOJ = null; caja.classList.remove("corre"); caja.classList.add("fin"); seg.textContent = "¡Listo!"; b.textContent = "Repetir"; } }, 1000);
}

function pEvaluacion() {
  if (hechos() < MODULOS.length) return ir("menu");
  const ev = S.ev;
  if (!ev.actual) { ev.actual = { n: ev.intentos.length + 1, resp: {}, enviado: false }; guardar(); }
  const a = ev.actual;
  let h = '<div class="card"><div class="kicker">Evaluación final · intento ' + a.n + '</div><h1>Evaluación final: ' + esc(CURSO.titulo) + '</h1>';
  if (!a.enviado) h += '<p>Responda las ' + EVALUACION.length + ' preguntas y pulse «Enviar respuestas». Se aprueba con <b>' + CURSO.aprobacion + ' %</b> (' + Math.ceil(CURSO.aprobacion * EVALUACION.length / 100) + ' aciertos o más).</p>';
  else {
    const ok = EVALUACION.filter((q, k) => a.resp[k] === 0).length, cal = Math.round(ok / EVALUACION.length * 100), aprueba = cal >= CURSO.aprobacion;
    h += '<div class="resultado"><div class="cal ' + (aprueba ? "ok" : "no") + '">' + cal + ' %</div><p><b>' + ok + ' de ' + EVALUACION.length + '</b> respuestas correctas · ' + (aprueba ? "Evaluación aprobada" : "Evaluación no aprobada") + '</p></div>' +
      '<div class="acc no-imp" style="justify-content:center;margin-top:0">' + (aprueba ? '<button class="btn btn-v" id="bComp">Ver e imprimir mi constancia</button>' : '<button class="btn btn-p" id="bOtra">Volver a intentarlo</button><button class="btn btn-s" id="bMenu">Repasar los módulos</button>') + '</div>';
  }
  EVALUACION.forEach((q, k) => {
    const ord = orden(q.ops.length, "e" + a.n + "-" + k), sel = a.resp[k];
    h += '<div class="evq"><div class="preg">' + (k + 1) + '. ' + esc(q.q) + '</div><div class="ops">' +
      ord.map((oi, j) => { let c = "op"; if (a.enviado) { if (oi === 0) c += " bien"; else if (sel === oi) c += " mal"; } else if (sel === oi) c += " sel";
        return '<button class="' + c + '" data-q="' + k + '" data-o="' + oi + '"' + (a.enviado ? " disabled" : "") + ' aria-pressed="' + (sel === oi) + '"><span class="l">' + LET[j] + '</span><span>' + esc(q.ops[oi]) + '</span></button>'; }).join("") + '</div>' +
      (a.enviado ? '<div class="fb ' + (sel === 0 ? "ok" : "no") + '">' + (sel === 0 ? "<b>Correcto.</b> " : "<b>Correcta: " + esc(q.ops[0]) + ".</b> ") + esc(q.exp) + '</div>' : "") + '</div>';
  });
  const cont = Object.keys(a.resp).length;
  if (!a.enviado) h += '<div class="acc no-imp"><button class="btn btn-p" id="bEnv"' + (cont === EVALUACION.length ? "" : " disabled") + '>Enviar respuestas</button><span class="paso">Contestadas: ' + cont + ' de ' + EVALUACION.length + '</span><button class="btn btn-s der" id="bSalir">Guardar y salir</button></div>';
  h += '</div>';
  app().innerHTML = h;
  app().querySelectorAll("[data-q]").forEach((b) => b.onclick = () => {
    a.resp[+b.dataset.q] = +b.dataset.o; guardar();
    const y = window.scrollY; render(); window.scrollTo(0, y);
  });
  if ($("#bEnv")) $("#bEnv").onclick = () => {
    a.enviado = true; const ok = EVALUACION.filter((q, k) => a.resp[k] === 0).length, cal = Math.round(ok / EVALUACION.length * 100);
    ev.intentos.push({ n: a.n, fecha: new Date().toISOString(), aciertos: ok, cal });
    if (cal >= CURSO.aprobacion) { ev.aprobado = true; ev.cal = cal; ev.fecha = new Date().toISOString(); }
    guardar(); render(); arriba();
  };
  if ($("#bOtra")) $("#bOtra").onclick = () => { ev.actual = null; ir("evaluacion"); };
  if ($("#bMenu")) $("#bMenu").onclick = () => { ev.actual = null; ir("menu"); };
  if ($("#bComp")) $("#bComp").onclick = () => { ev.actual = null; ir("comprobante"); };
  if ($("#bSalir")) $("#bSalir").onclick = () => ir("menu");
}

function pComprobante() {
  if (!S.ev.aprobado) return ir("menu");
  const ev = S.ev;
  let h = '<div class="card comp"><div class="inst">' + esc(CURSO.institucion) + '</div><h1>' + esc(CURSO.constancia) + '</h1>' +
    '<p style="text-align:center" class="tenue">' + CURSO.clave + ' · Curso virtual · ' + CURSO.duracion + '</p>' +
    '<table class="t"><tbody>' +
    '<tr><th style="width:38%">Nombre</th><td>' + esc(S.nombre) + '</td></tr>' +
    '<tr><th>Número de empleado</th><td>' + esc(S.empleado || "—") + '</td></tr>' +
    '<tr><th>Puesto</th><td>' + esc(S.puesto) + '</td></tr>' +
    '<tr><th>Área o servicio</th><td>' + esc(S.area) + '</td></tr>' +
    '<tr><th>Fecha de inicio</th><td>' + hoy(S.inicio) + '</td></tr>' +
    '<tr><th>Fecha de acreditación</th><td>' + hoy(ev.fecha) + '</td></tr>' +
    '<tr><th>Calificación final</th><td><b>' + ev.cal + ' %</b> (mínimo aprobatorio ' + CURSO.aprobacion + ' %) · intentos: ' + ev.intentos.length + '</td></tr>' +
    (CURSO.vigenciaMeses ? '<tr><th>Vigencia</th><td>Hasta el ' + hoy(vence(ev.fecha, CURSO.vigenciaMeses)) + (CURSO.vigenciaNota ? ', ' + esc(CURSO.vigenciaNota) : '') + '</td></tr>' : '') +
    '</tbody></table>' +
    '<h3>Módulos concluidos</h3><table class="t"><thead><tr><th>Módulo</th><th>Fecha</th></tr></thead><tbody>' +
    MODULOS.map((m) => '<tr><td>' + m.id + '. ' + esc(m.titulo) + '</td><td>' + (S.mods[m.id] && S.mods[m.id].fecha ? hoy(S.mods[m.id].fecha) : "—") + '</td></tr>').join("") + '</tbody></table>' +
    (LISTA_V ? '<h3>' + esc(LISTA_V.titulo) + '</h3>' + LISTA_V.items.map((x) => '<div class="chk"><span class="c"></span><span>' + esc(x) + '</span></div>').join("") : '') +
    '<div class="firmas">' + CURSO.firmas.map((f, k) => '<div>' + esc(f) + '<br>' + (k === 0 ? esc(S.nombre) : 'Nombre y firma') + '</div>').join("") + '</div>' +
    '<p class="tenue" style="font-size:.8rem;margin-top:1.5rem">' + esc(CURSO.notaConstancia) + '</p>' +
    '<div class="acc no-imp"><button class="btn btn-p" id="bImp">Imprimir o guardar como PDF</button><button class="btn btn-s" id="bResp">Descargar respaldo</button><button class="btn btn-s der" id="bMenu">Volver al menú</button></div></div>';
  app().innerHTML = h;
  $("#bImp").onclick = () => window.print(); $("#bResp").onclick = descargarRespaldo; $("#bMenu").onclick = () => ir("menu");
}

/* ---------- arranque ---------- */
document.addEventListener("DOMContentLoaded", () => { S = null; render(); });

</script>
</body>
</html>
