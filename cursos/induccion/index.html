<style>
/* CV-OBL-001 Inducción institucional — estilos sencillos, fondo claro */
:root {
  color-scheme: light;
  --azul: #1F4E79; --azul2: #2D6CA3; --turq: #14A3A6; --turq-cl: #E3F5F5;

* { box-sizing: border-box; }
html { font-size: 18px; background: var(--fondo); }
body { margin: 0; background: var(--fondo); color: var(--texto); font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; line-height: 1.6; }
button, input, select { font: inherit; color: inherit; }
.oculto { display: none !important; }
:focus-visible { outline: 3px solid var(--turq); outline-offset: 2px; }

header.barra { background: #fff; border-bottom: 1px solid var(--borde); position: sticky; top: 0; z-index: 10; }
.barra-in { max-width: 900px; margin: 0 auto; padding: .6rem 1rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.marca { font-weight: 800; color: var(--azul); line-height: 1.2; }
.marca small { display: block; font-weight: 600; color: var(--tenue); font-size: .72rem; }
.prog { flex: 1 1 200px; }
.prog .t { font-size: .75rem; color: var(--tenue); font-weight: 600; }
.pbar { height: 10px; background: #E5ECF2; border-radius: 99px; overflow: hidden; }
.pbar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--turq), var(--verde)); transition: width .5s; }

main { max-width: 900px; margin: 0 auto; padding: 1.4rem 1rem 3rem; }
.card { background: #fff; border: 1px solid var(--borde); border-radius: 14px; padding: 1.5rem; box-shadow: 0 2px 10px rgba(16,42,67,.06); }
.card + .card { margin-top: 1rem; }
h1, h2, h3 { color: var(--azul); line-height: 1.25; margin: 0 0 .6rem; }
h1 { font-size: 1.9rem; } h2 { font-size: 1.4rem; } h3 { font-size: 1.12rem; }
p { margin: 0 0 .8rem; }
.kicker { text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; font-weight: 800; color: var(--turq); margin-bottom: .2rem; }
.tenue { color: var(--tenue); }
ul.lst { margin: 0 0 .9rem; padding-left: 1.3rem; } ul.lst li { margin-bottom: .4rem; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border: 0; border-radius: 12px; padding: .75rem 1.3rem; font-weight: 700; cursor: pointer; min-height: 48px; font-size: 1rem; }
.btn-p { background: var(--azul); color: #fff; } .btn-p:hover { background: #183F63; }
.btn-s { background: #fff; color: var(--azul); border: 2px solid var(--azul); } .btn-s:hover { background: var(--fondo); }
.btn-v { background: var(--verde); color: #fff; }
.btn-x { background: #fff; color: var(--rojo); border: 2px solid #E7B5AF; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.acc { display: flex; gap: .7rem; flex-wrap: wrap; margin-top: 1.2rem; align-items: center; }
.acc .der { margin-left: auto; }

label { display: block; font-weight: 700; color: var(--azul); margin: .7rem 0 .3rem; }
input[type=text], select { width: 100%; border: 2px solid var(--borde); border-radius: 10px; padding: .7rem .85rem; background: #fff; color: var(--texto); -webkit-text-fill-color: var(--texto); }
input[type=text]:focus, select:focus { border-color: var(--turq); outline: none; }
input::placeholder { color: #8A99A8; -webkit-text-fill-color: #8A99A8; }
.campos { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
.aviso { font-size: .85rem; color: var(--tenue); margin-top: .5rem; }
.error { color: var(--rojo); font-weight: 600; font-size: .9rem; min-height: 1.2rem; margin-top: .4rem; }

.mods { display: grid; gap: .8rem; }
.mod { display: flex; gap: 1rem; align-items: center; background: #fff; border: 1px solid var(--borde); border-radius: 14px; padding: 1rem 1.1rem; }
.mod .n { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 1.2rem; background: var(--turq-cl); color: #0E5A6B; flex: none; }
.mod.hecho .n { background: var(--verde); color: #fff; }
.mod.bloq { opacity: .6; }
.mod .info { flex: 1; min-width: 0; }

.mod .info small { color: var(--tenue); }

table.t { width: 100%; border-collapse: collapse; margin: .2rem 0 1rem; font-size: .95rem; }

.alerta { background: var(--rojo-cl); border-color: var(--rojo); }

.ops { display: grid; gap: .6rem; }
.op { text-align: left; display: flex; gap: .7rem; align-items: flex-start; background: #fff; border: 2px solid var(--borde); border-radius: 12px; padding: .75rem .9rem; cursor: pointer; min-height: 50px; }

.op .l { width: 28px; height: 28px; border-radius: 7px; background: var(--fondo); color: var(--azul); display: grid; place-items: center; font-weight: 800; flex: none; font-size: .88rem; }
.op.sel { border-color: var(--azul); background: #F1F6FB; } .op.sel .l { background: var(--azul); color: #fff; }
.op.bien { border-color: var(--verde); background: var(--verde-cl); } .op.bien .l { background: var(--verde); color: #fff; }
.op.mal { border-color: var(--rojo); background: var(--rojo-cl); } .op.mal .l { background: var(--rojo); color: #fff; }
.op[disabled] { cursor: default; }
.fb { margin-top: 1rem; border-radius: 12px; padding: .9rem 1rem; }
.fb.ok { background: var(--verde-cl); color: #1E5233; } .fb.no { background: var(--rojo-cl); color: #6E1F17; }
.evq { border-top: 1px solid var(--borde); padding-top: 1.1rem; margin-top: 1.1rem; }
.evq:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.resultado { text-align: center; padding: 1rem 0; }
.resultado .cal { font-size: 3rem; font-weight: 800; line-height: 1; }
.cal.ok { color: var(--verde); } .cal.no { color: var(--rojo); }

/* comprobante */
.comp h1 { font-size: 1.5rem; text-align: center; }
.comp .inst { text-align: center; color: var(--tenue); margin-bottom: 1rem; }
.chk { display: flex; gap: .6rem; align-items: flex-start; padding: .3rem 0; border-bottom: 1px dashed var(--borde); font-size: .95rem; }
.chk .c { width: 18px; height: 18px; border: 2px solid #7F8C99; border-radius: 4px; flex: none; margin-top: .2rem; }
.firmas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; margin-top: 2.5rem; text-align: center; font-size: .85rem; }
.firmas div { border-top: 1px solid #555; padding-top: .3rem; }

footer { text-align: center; color: var(--tenue); font-size: .8rem; padding: 1rem; }
.toast { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); background: var(--azul); color: #fff; padding: .7rem 1.1rem; border-radius: 10px; z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,.18); max-width: 90vw; }
.velo { position: fixed; inset: 0; background: rgba(16,32,48,.45); display: grid; place-items: center; padding: 1rem; z-index: 40; }
.modal { background: #fff; border-radius: 14px; padding: 1.4rem; max-width: 520px; width: 100%; }

@media (max-width: 640px) {
  html { font-size: 17px; }
  .card { padding: 1.1rem; }
  .campos { grid-template-columns: 1fr; }
  .acc .btn { flex: 1 1 auto; } .acc .der { margin-left: 0; }
  h1 { font-size: 1.55rem; }
  .firmas { grid-template-columns: 1fr; gap: 2rem; }
  table.t { font-size: .88rem; }
}
@media print {
  html, body { background: #fff; font-size: 11pt; }
  header.barra, footer, .no-imp, .toast { display: none !important; }
  main { padding: 0; max-width: none; }
  .card { border: 0; box-shadow: none; padding: 0; }
  table.t th { background: #1F4E79 !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

</style>

  let h = '<div class="card"><div class="kicker">' + CURSO.corta + ' · Curso obligatorio de nuevo ingreso</div><h1>' + CURSO.titulo + '</h1>' +
    '<p>' + CURSO.subtitulo + '. Este curso le presenta el hospital, sus reglas, la seguridad del paciente y qué hacer en una emergencia. Debe concluirlo <b>antes de asumir sus funciones</b>.</p>' +
    '<ul class="lst"><li>5 módulos breves de lectura, con 2 preguntas de repaso cada uno.</li><li>Una evaluación final de 15 preguntas; se aprueba con ' + CURSO.aprobacion + ' % o más.</li><li>Duración aproximada: ' + CURSO.duracion + '. Puede hacer pausas: su avance se guarda en este navegador.</li><li>Al aprobar, imprima su comprobante y entréguelo a su jefe inmediato.</li></ul></div>';
  if (previo) h += '<div class="card"><h2>Continuar</h2><p>Hay un avance guardado de <b>' + esc(previo.nombre) + '</b>.</p><div class="acc"><button class="btn btn-p" id="bCont">Continuar mi curso</button><button class="btn btn-x" id="bOtro">Empezar como otra persona</button></div></div>';
  else h += '<div class="card"><h2>Sus datos</h2>' +
    '<div class="campos"><div><label for="fNom">Nombre completo</label><input type="text" id="fNom" maxlength="80" autocomplete="name"></div>' +
    '<div><label for="fEmp">Número de empleado</label><input type="text" id="fEmp" maxlength="20" inputmode="numeric"></div>' +
    '<div><label for="fPue">Puesto</label><input type="text" id="fPue" maxlength="60" placeholder="Por ejemplo: enfermera general"></div>' +
    '<div><label for="fAre">Área o servicio</label><input type="text" id="fAre" maxlength="60" placeholder="Por ejemplo: Urgencias"></div></div>' +
    '<p class="aviso">Estos datos solo aparecen en su comprobante. No escriba información de pacientes.</p><p class="error" id="err" role="alert"></p>' +
    '<div class="acc"><button class="btn btn-p" id="bIni">Comenzar el curso</button></div></div>';
  h += '<div class="card"><p class="tenue" style="margin:0">¿Tiene un archivo de respaldo de otro equipo? <button class="btn btn-s" id="bCarg" style="min-height:40px;padding:.4rem .9rem;margin-left:.4rem">Cargar respaldo</button></p></div>';
  app().innerHTML = h;
  $("#bCarg").onclick = cargarRespaldo;
  if (previo) {
    $("#bCont").onclick = () => { S = previo; render(); arriba(); };
    $("#bOtro").onclick = () => confirmar("Se borrará el avance guardado de " + esc(previo.nombre) + ". ¿Desea continuar?", "Borrar y empezar", () => { try { localStorage.removeItem(CLAVE_GUARDADO); } catch (e) { /* sin acción */ } render(); });
  } else {
    $("#bIni").onclick = () => {
      const v = (id) => $(id).value.trim().replace(/\s+/g, " ");
      const d = { nombre: v("#fNom"), empleado: v("#fEmp"), puesto: v("#fPue"), area: v("#fAre") };
      if (d.nombre.length < 5) return ($("#err").textContent = "Escriba su nombre completo.", $("#fNom").focus());
      if (!d.puesto || !d.area) return ($("#err").textContent = "Escriba su puesto y su área o servicio.", (d.puesto ? $("#fAre") : $("#fPue")).focus());
      S = nuevo(d); guardar(); render(); arriba();
    };
  }
}

function pMenu() {
  const todos = hechos() === MODULOS.length;
  let h = '<div class="card"><div class="kicker">Inducción institucional</div><h1>Hola, ' + esc(S.nombre.split(" ")[0]) + '</h1><p class="tenue" style="margin:0">Realice los módulos en orden. Cuando termine los cinco, se habilita la evaluación final.</p></div><div class="mods" style="margin-top:1rem">';
  MODULOS.forEach((m, i) => {
    const st = S.mods[m.id]; const bloq = i > 0 && !(S.mods[MODULOS[i - 1].id] && S.mods[MODULOS[i - 1].id].hecho);
    const estado = st && st.hecho ? '<span class="estado e-ok">Completado</span>' : (bloq ? '<span class="estado e-no">Disponible al terminar el módulo ' + (i) + '</span>' : (st && st.pag ? '<span class="estado e-cur">En curso</span>' : '<span class="estado e-cur">Pendiente</span>'));
    h += '<div class="mod' + (st && st.hecho ? " hecho" : "") + (bloq ? " bloq" : "") + '"><div class="n">' + (st && st.hecho ? "✓" : m.id) + '</div><div class="info"><b>' + esc(m.titulo) + '</b><small>' + m.min + ' minutos</small><br>' + estado + '</div>' +
      (bloq ? "" : '<button class="btn ' + (st && st.hecho ? "btn-s" : "btn-p") + '" data-m="' + m.id + '">' + (st && st.hecho ? "Repasar" : (st && st.pag ? "Continuar" : "Iniciar")) + '</button>') + '</div>';
  });
  const ev = S.ev;
  h += '<div class="mod' + (ev.aprobado ? " hecho" : "") + (todos ? "" : " bloq") + '"><div class="n">' + (ev.aprobado ? "✓" : "★") + '</div><div class="info"><b>Evaluación final</b><small>15 preguntas · aprobación ' + CURSO.aprobacion + ' %</small><br>' +
    (ev.aprobado ? '<span class="estado e-ok">Aprobada · ' + ev.cal + ' %</span>' : (todos ? '<span class="estado e-cur">' + (ev.intentos.length ? "Intentos: " + ev.intentos.length : "Disponible") + '</span>' : '<span class="estado e-no">Disponible al terminar los 5 módulos</span>')) + '</div>' +
    (ev.aprobado ? '<button class="btn btn-v" id="bComp">Ver comprobante</button>' : (todos ? '<button class="btn btn-p" id="bEv">' + (ev.actual ? "Continuar" : "Presentar") + '</button>' : "")) + '</div></div>';
  h += '<div class="acc no-imp"><button class="btn btn-s" id="bResp">Descargar respaldo</button><button class="btn btn-s" id="bCarg">Cargar respaldo</button><button class="btn btn-x der" id="bReset">Reiniciar curso</button></div>';
  app().innerHTML = h;
  app().querySelectorAll("[data-m]").forEach((b) => b.onclick = () => { const st = M(+b.dataset.m); if (st.hecho) st.pag = 0; ir("modulo", { mid: +b.dataset.m }); });
  if ($("#bEv")) $("#bEv").onclick = () => ir("evaluacion");
  if ($("#bComp")) $("#bComp").onclick = () => ir("comprobante");
  $("#bResp").onclick = descargarRespaldo; $("#bCarg").onclick = cargarRespaldo;
  $("#bReset").onclick = () => confirmar("Se borrará todo su avance en este navegador. ¿Desea reiniciar el curso?", "Reiniciar", () => { try { localStorage.removeItem(CLAVE_GUARDADO); } catch (e) { /* sin acción */ } S = null; render(); arriba(); });
}

function bloque(b) {
  const [t, v, w] = b;
  if (t === "p") return "<p>" + fmt(v) + "</p>";
  if (t === "lista") return '<ul class="lst">' + v.map((x) => "<li>" + fmt(x) + "</li>").join("") + "</ul>";
  if (t === "tabla") return '<table class="t"><thead><tr>' + v.map((x) => "<th>" + esc(x) + "</th>").join("") + "</tr></thead><tbody>" + w.map((r) => "<tr>" + r.map((c) => "<td>" + fmt(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
  if (t === "nota") return '<div class="nota">' + fmt(v) + "</div>";
  if (t === "alerta") return '<div class="alerta">' + fmt(v) + "</div>";
  if (t === "pendiente") return '<div class="pend"><b>Pendiente de definición institucional:</b> ' + fmt(v) + "</div>";
  return "";
}
function pModulo() {
  const m = MODULOS.find((x) => x.id === S.mid); if (!m) return ir("menu");
  const st = M(m.id); const nL = m.paginas.length, nQ = m.repaso.length, total = nL + nQ + 1;
  const i = Math.min(st.pag, total - 1);
  let h = '<div class="card"><div class="kicker">Módulo ' + m.id + ' de ' + MODULOS.length + ' · ' + esc(m.titulo) + '</div>' +
    '<div class="pbar" style="margin:.3rem 0 1rem"><span style="width:' + Math.round((i + 1) / total * 100) + '%"></span></div>';
  let puede = true;
  if (i < nL) {
    const pg = m.paginas[i];
    if (i === 0) h += '<p class="tenue"><b>Objetivo:</b> ' + esc(m.objetivo) + '</p>';
    h += '<h2>' + esc(pg.t) + '</h2>' + pg.b.map(bloque).join("");
  } else if (i < nL + nQ) {
    const qi = i - nL, q = m.repaso[qi], r = st.resp[qi], ord = orden(q.ops.length, "r" + m.id + "-" + qi);
    const resp = r && r.listo;
    h += '<h2>Repaso ' + (qi + 1) + ' de ' + nQ + '</h2><div class="preg">' + esc(q.q) + '</div><div class="ops">' +
      ord.map((oi, k) => { let c = "op"; if (resp) { if (oi === 0) c += " bien"; else if (r.sel === oi) c += " mal"; } else if (r && r.sel === oi) c += " sel";
        return '<button class="' + c + '" data-o="' + oi + '"' + (resp ? " disabled" : "") + '><span class="l">' + LET[k] + '</span><span>' + esc(q.ops[oi]) + '</span></button>'; }).join("") + '</div>';
    if (resp) h += '<div class="fb ' + (r.sel === 0 ? "ok" : "no") + '" role="status"><b>' + (r.sel === 0 ? "¡Correcto! " : "La respuesta correcta es: " + esc(q.ops[0]) + ". ") + '</b>' + esc(q.exp) + '</div>';
    else { h += '<div class="acc"><button class="btn btn-p" id="bRev"' + (r && r.sel != null ? "" : " disabled") + '>Comprobar</button></div>'; puede = false; }
  } else {
    h += '<h2>¡Módulo completado!</h2><p>Terminó el módulo <b>' + esc(m.titulo) + '</b>.</p><ul class="lst"><li>' + m.paginas.map((p) => esc(p.t)).join("</li><li>") + '</li></ul>';
    if (!st.hecho) { st.hecho = true; st.fecha = new Date().toISOString(); guardar(); barra(); }
  }
  const ult = i === total - 1;
  h += '<div class="acc no-imp">' + (i > 0 ? '<button class="btn btn-s" id="bAnt">Anterior</button>' : "") +
    (ult ? '<button class="btn btn-p" id="bMenu">' + (MODULOS[m.id] && !(S.mods[m.id + 1] && S.mods[m.id + 1].hecho) ? "Ir al módulo " + (m.id + 1) : (hechos() === MODULOS.length && !S.ev.aprobado ? "Ir a la evaluación final" : "Volver al menú")) + '</button>'
      : '<button class="btn btn-p" id="bSig"' + (puede ? "" : " disabled") + '>Siguiente</button>') +
    '<button class="btn btn-s der" id="bSalir">Guardar y salir</button><span class="paso">Página ' + (i + 1) + ' de ' + total + '</span></div></div>';
  app().innerHTML = h;
  app().querySelectorAll(".op[data-o]").forEach((b) => b.onclick = () => { const qi = i - nL; st.resp[qi] = { sel: +b.dataset.o }; guardar(); render(); });
  if ($("#bRev")) $("#bRev").onclick = () => { st.resp[i - nL].listo = true; guardar(); render(); const f = app().querySelector(".fb"); if (f) f.scrollIntoView({ block: "nearest" }); };
  if ($("#bAnt")) $("#bAnt").onclick = () => { st.pag = i - 1; guardar(); render(); arriba(); };
  if ($("#bSig")) $("#bSig").onclick = () => { st.pag = i + 1; guardar(); render(); arriba(); };
  if ($("#bMenu")) $("#bMenu").onclick = () => {
    const sig = MODULOS[m.id];
    if (sig && !(S.mods[sig.id] && S.mods[sig.id].hecho)) ir("modulo", { mid: sig.id });
    else if (hechos() === MODULOS.length && !S.ev.aprobado) ir("evaluacion"); else ir("menu");
  };
  $("#bSalir").onclick = () => ir("menu");
}

function pEvaluacion() {
  if (hechos() < MODULOS.length) return ir("menu");
  const ev = S.ev;
  if (!ev.actual) { ev.actual = { n: ev.intentos.length + 1, resp: {}, enviado: false }; guardar(); }
  const a = ev.actual;
  let h = '<div class="card"><div class="kicker">Evaluación final · intento ' + a.n + '</div><h1>Evaluación de la inducción</h1>';
  if (!a.enviado) h += '<p>Responda las 15 preguntas y pulse «Enviar respuestas». Se aprueba con <b>' + CURSO.aprobacion + ' %</b> (12 aciertos o más).</p>';
  else {
    const ok = EVALUACION.filter((q, k) => a.resp[k] === 0).length, cal = Math.round(ok / EVALUACION.length * 100), aprueba = cal >= CURSO.aprobacion;
    h += '<div class="resultado"><div class="cal ' + (aprueba ? "ok" : "no") + '">' + cal + ' %</div><p><b>' + ok + ' de ' + EVALUACION.length + '</b> respuestas correctas · ' + (aprueba ? "Evaluación aprobada" : "Evaluación no aprobada") + '</p></div>' +
      '<div class="acc no-imp" style="justify-content:center;margin-top:0">' + (aprueba ? '<button class="btn btn-v" id="bComp">Ver e imprimir mi comprobante</button>' : '<button class="btn btn-p" id="bOtra">Volver a intentarlo</button><button class="btn btn-s" id="bMenu">Repasar los módulos</button>') + '</div>';
  }
  EVALUACION.forEach((q, k) => {
    const ord = orden(q.ops.length, "e" + a.n + "-" + k), sel = a.resp[k];
    h += '<div class="evq"><div class="preg">' + (k + 1) + '. ' + esc(q.q) + '</div><div class="ops">' +
      ord.map((oi, j) => { let c = "op"; if (a.enviado) { if (oi === 0) c += " bien"; else if (sel === oi) c += " mal"; } else if (sel === oi) c += " sel";
        return '<button class="' + c + '" data-q="' + k + '" data-o="' + oi + '"' + (a.enviado ? " disabled" : "") + ' aria-pressed="' + (sel === oi) + '"><span class="l">' + LET[j] + '</span><span>' + esc(q.ops[oi]) + '</span></button>'; }).join("") + '</div>' +
      (a.enviado ? '<div class="fb ' + (sel === 0 ? "ok" : "no") + '">' + (sel === 0 ? "<b>Correcto.</b> " : "<b>Correcta: " + esc(q.ops[0]) + ".</b> ") + esc(q.exp) + '</div>' : "") + '</div>';
  });
  const cont = Object.keys(a.resp).length;
  if (!a.enviado) h += '<div class="acc no-imp"><button class="btn btn-p" id="bEnv"' + (cont === EVALUACION.length ? "" : " disabled") + '>Enviar respuestas</button><span class="paso">Contestadas: ' + cont + ' de ' + EVALUACION.length + '</span><button class="btn btn-s der" id="bSalir">Guardar y salir</button></div>';
  h += '</div>';
  app().innerHTML = h;
  app().querySelectorAll("[data-q]").forEach((b) => b.onclick = () => {
    a.resp[+b.dataset.q] = +b.dataset.o; guardar();
    const y = window.scrollY; render(); window.scrollTo(0, y);
  });
  if ($("#bEnv")) $("#bEnv").onclick = () => {
    a.enviado = true; const ok = EVALUACION.filter((q, k) => a.resp[k] === 0).length, cal = Math.round(ok / EVALUACION.length * 100);
    ev.intentos.push({ n: a.n, fecha: new Date().toISOString(), aciertos: ok, cal });
    if (cal >= CURSO.aprobacion) { ev.aprobado = true; ev.cal = cal; ev.fecha = new Date().toISOString(); }
    guardar(); render(); arriba();
  };
  if ($("#bOtra")) $("#bOtra").onclick = () => { ev.actual = null; ir("evaluacion"); };
  if ($("#bMenu")) $("#bMenu").onclick = () => { ev.actual = null; ir("menu"); };
  if ($("#bComp")) $("#bComp").onclick = () => { ev.actual = null; ir("comprobante"); };
  if ($("#bSalir")) $("#bSalir").onclick = () => ir("menu");
}

function pComprobante() {
  if (!S.ev.aprobado) return ir("menu");
  const ev = S.ev;
  let h = '<div class="card comp"><div class="inst">' + esc(CURSO.institucion) + '</div><h1>Comprobante de inducción institucional</h1>' +
    '<p style="text-align:center" class="tenue">' + CURSO.clave + ' · Curso virtual · ' + CURSO.duracion + '</p>' +
    '<table class="t"><tbody>' +
    '<tr><th style="width:38%">Nombre</th><td>' + esc(S.nombre) + '</td></tr>' +
    '<tr><th>Número de empleado</th><td>' + esc(S.empleado || "—") + '</td></tr>' +
    '<tr><th>Puesto</th><td>' + esc(S.puesto) + '</td></tr>' +
    '<tr><th>Área o servicio</th><td>' + esc(S.area) + '</td></tr>' +
    '<tr><th>Fecha de inicio</th><td>' + hoy(S.inicio) + '</td></tr>' +
    '<tr><th>Fecha de acreditación</th><td>' + hoy(ev.fecha) + '</td></tr>' +
    '<tr><th>Calificación final</th><td><b>' + ev.cal + ' %</b> (mínimo aprobatorio ' + CURSO.aprobacion + ' %) · intentos: ' + ev.intentos.length + '</td></tr>' +
    '</tbody></table>' +
    '<h3>Módulos concluidos</h3><table class="t"><thead><tr><th>Módulo</th><th>Fecha</th></tr></thead><tbody>' +
    MODULOS.map((m) => '<tr><td>' + m.id + '. ' + esc(m.titulo) + '</td><td>' + (S.mods[m.id] && S.mods[m.id].fecha ? hoy(S.mods[m.id].fecha) : "—") + '</td></tr>').join("") + '</tbody></table>' +
    '<h3>Orientación específica en el área (la completa el jefe inmediato)</h3>' +
    ORIENTACION_AREA.map((x) => '<div class="chk"><span class="c"></span><span>' + esc(x) + '</span></div>').join("") +
    '<div class="firmas"><div>Trabajador(a)<br>' + esc(S.nombre) + '</div><div>Jefe(a) inmediato(a)<br>Nombre y firma</div><div>Jefatura de Enseñanza e Investigación<br>Nombre y firma</div></div>' +
    '<p class="tenue" style="font-size:.8rem;margin-top:1.5rem">Entregue este comprobante firmado a su jefe inmediato; el original se integra a su expediente de personal y la Jefatura de Enseñanza conserva el registro.</p>' +
    '<div class="acc no-imp"><button class="btn btn-p" id="bImp">Imprimir o guardar como PDF</button><button class="btn btn-s" id="bResp">Descargar respaldo</button><button class="btn btn-s der" id="bMenu">Volver al menú</button></div></div>';
  app().innerHTML = h;
  $("#bImp").onclick = () => window.print(); $("#bResp").onclick = descargarRespaldo; $("#bMenu").onclick = () => ir("menu");
}

/* ---------- arranque ---------- */
document.addEventListener("DOMContentLoaded", () => { S = null; render(); });

</script>
</body>
</html>
