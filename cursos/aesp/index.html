<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MISIÓN AESP: Cero daños evitables · CV-OBL-002</title>
<meta name="description" content="Curso CV-OBL-002 Acciones Esenciales para la Seguridad del Paciente (AESP) en formato de juego educativo.">
<!--
  MISIÓN AESP: Cero daños evitables — Curso CV-OBL-002
  Aplicación educativa en un solo archivo (HTML5 + CSS3 + JavaScript puro).
  Funciona sin conexión ni servidor: abra este archivo en cualquier navegador moderno.
  Para modificar: CONFIG (criterio de aprobación, puntos, tiempos) está al inicio del motor;
  los contenidos están en las constantes MISIONES, DIAGNOSTICO, EVALUACION y FUENTES.
-->
<style>
/* ==========================================================================
   ESTILOS — MISIÓN AESP: Cero daños evitables
   Paleta: azul institucional, azul petróleo, turquesa y acentos verdes.
   ========================================================================== */
:root {
  --azul: #1F4E79;
  --azul-2: #2D6CA3;
  --petroleo: #0E5A6B;
  --turquesa: #14A3A6;
  --turquesa-claro: #E3F5F5;
  --verde: #2E9D5B;
  --verde-claro: #E6F5EC;
  --rojo: #B83227;
  --rojo-claro: #FBEAE8;
  --ambar: #B7791F;
  --ambar-claro: #FFF5E0;
  --fondo: #F4F7FA;
  --tarjeta: #FFFFFF;
  --borde: #D9E2EA;
  --texto: #1B2733;
  --tenue: #536373;
  --sombra: 0 2px 10px rgba(16, 42, 67, .07);
  --sombra-2: 0 8px 28px rgba(16, 42, 67, .12);
  --radio: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { font-size: 18px; }
body {
  margin: 0; background: var(--fondo); color: var(--texto);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.55; -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
html, body { background-color: var(--fondo); }
a { color: var(--azul-2); }
.oculto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--turquesa); outline-offset: 2px; }

/* ---------- Encabezado ---------- */
.barra {
  position: sticky; top: 0; z-index: 30; background: #fff; border-bottom: 1px solid var(--borde);
  box-shadow: 0 1px 6px rgba(16,42,67,.05);
}
.barra-int { max-width: 1120px; margin: 0 auto; padding: .55rem 1rem; display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; }
.marca { display: flex; align-items: center; gap: .55rem; font-weight: 800; color: var(--azul); letter-spacing: .02em; font-size: 1rem; white-space: nowrap; }
.marca .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--azul), var(--turquesa)); color: #fff; display: grid; place-items: center; }
.marca small { display: block; font-weight: 600; color: var(--tenue); font-size: .7rem; letter-spacing: 0; }
.progreso { flex: 1 1 220px; min-width: 180px; }
.progreso .etq { display: flex; justify-content: space-between; font-size: .72rem; color: var(--tenue); font-weight: 600; }
.pbar { height: 10px; background: #E8EEF3; border-radius: 99px; overflow: hidden; }
.pbar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--turquesa), var(--verde)); border-radius: 99px; transition: width .6s ease; }
.stats { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: .35rem; background: var(--fondo); border: 1px solid var(--borde); border-radius: 99px; padding: .25rem .7rem; font-size: .82rem; font-weight: 700; color: var(--azul); white-space: nowrap; }
.chip svg { width: 18px; height: 18px; }
.chip.pts { background: var(--turquesa-claro); border-color: #BDE6E6; color: var(--petroleo); }
.btn-ico { display: inline-flex; align-items: center; gap: .35rem; border: 1px solid var(--borde); background: #fff; color: var(--azul); border-radius: 10px; padding: .4rem .7rem; cursor: pointer; font-size: .82rem; font-weight: 700; }
.btn-ico:hover { background: var(--fondo); }
.btn-ico svg { width: 18px; height: 18px; }

/* ---------- Contenedor ---------- */
main { max-width: 1120px; margin: 0 auto; padding: 1.4rem 1rem 3rem; }
.tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); padding: 1.4rem 1.5rem; }
.tarjeta + .tarjeta { margin-top: 1rem; }
h1, h2, h3 { color: var(--azul); line-height: 1.25; margin: 0 0 .6rem; }
h1 { font-size: 2rem; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.15rem; }
p { margin: 0 0 .8rem; }
.tenue { color: var(--tenue); }
.kicker { text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; font-weight: 800; color: var(--turquesa); margin-bottom: .3rem; }
.fila { display: flex; gap: .7rem; flex-wrap: wrap; align-items: center; }
.entre { justify-content: space-between; }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; border: 0; border-radius: 12px; padding: .75rem 1.25rem; font-weight: 700; cursor: pointer; font-size: 1rem; transition: transform .08s ease, box-shadow .2s ease, background .2s; min-height: 48px; }
.btn:active { transform: translateY(1px); }
.btn svg { width: 20px; height: 20px; }
.btn-p { background: var(--azul); color: #fff; box-shadow: 0 3px 10px rgba(31,78,121,.25); }
.btn-p:hover { background: #183F63; }
.btn-t { background: var(--turquesa); color: #fff; }
.btn-t:hover { background: #0F8B8E; }
.btn-s { background: #fff; color: var(--azul); border: 2px solid var(--azul); }
.btn-s:hover { background: var(--fondo); }
.btn-pista { background: var(--ambar-claro); color: #7A4F0E; border: 1px solid #F0D49B; }
.btn-peligro { background: var(--rojo); color: #fff; }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }

/* ---------- Bienvenida ---------- */
.hero { display: grid; grid-template-columns: 1.25fr 1fr; gap: 1.2rem; }
.hero-izq { background: linear-gradient(140deg, var(--azul) 0%, var(--petroleo) 60%, var(--turquesa) 100%); color: #fff; border-radius: var(--radio); padding: 2rem; box-shadow: var(--sombra-2); position: relative; overflow: hidden; }
.hero-izq h1 { color: #fff; font-size: 2.3rem; }
.hero-izq .sub { font-size: 1.15rem; opacity: .95; }
.hero-izq .meta { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.2rem; }
.hero-izq .meta span { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 99px; padding: .3rem .8rem; font-size: .85rem; font-weight: 600; }
.hero-izq .deco { position: absolute; right: -40px; bottom: -40px; width: 220px; height: 220px; opacity: .12; }
label { font-weight: 700; color: var(--azul); display: block; margin-bottom: .35rem; }
input[type=text] { width: 100%; border: 2px solid var(--borde); border-radius: 12px; padding: .75rem .9rem; font-size: 1.05rem; background: #fff; color: var(--texto); -webkit-text-fill-color: var(--texto); caret-color: var(--azul); }
input[type=text]::placeholder { color: #8A99A8; -webkit-text-fill-color: #8A99A8; opacity: 1; }
input[type=text]:focus { border-color: var(--turquesa); outline: none; }
.aviso { font-size: .85rem; color: var(--tenue); margin-top: .4rem; }
.reglas { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .8rem; }
.regla { background: var(--fondo); border-radius: 12px; padding: .9rem 1rem; border: 1px solid var(--borde); }
.regla b { color: var(--azul); }
table.puntos { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.puntos td, table.puntos th { padding: .45rem .6rem; border-bottom: 1px solid var(--borde); text-align: left; }
table.puntos th { color: var(--azul); }

/* ---------- Menú de misiones ---------- */
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
.mision { background: #fff; border: 1px solid var(--borde); border-radius: var(--radio); padding: 1.1rem 1.15rem; box-shadow: var(--sombra); display: flex; flex-direction: column; gap: .55rem; position: relative; transition: transform .15s, box-shadow .2s; }
.mision:hover { transform: translateY(-2px); box-shadow: var(--sombra-2); }
.mision .ico { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--turquesa-claro); color: var(--petroleo); }
.mision .ico svg { width: 30px; height: 30px; }
.mision.bloq { opacity: .6; }
.mision.bloq .ico { background: #EEF1F4; color: #8A99A8; }
.mision.hecha .ico { background: var(--verde-claro); color: var(--verde); }
.mision h3 { margin: 0; font-size: 1.05rem; }
.mision > .estado { align-self: flex-start; }
.mision .num { font-size: .75rem; font-weight: 800; color: var(--turquesa); letter-spacing: .06em; }
.estado { font-size: .8rem; font-weight: 700; border-radius: 99px; padding: .15rem .6rem; display: inline-block; }
.estado.e-bloq { background: #EEF1F4; color: #6B7B8A; }
.estado.e-disp { background: var(--turquesa-claro); color: var(--petroleo); }
.estado.e-curso { background: var(--ambar-claro); color: #7A4F0E; }
.estado.e-hecha { background: var(--verde-claro); color: #1E6B3E; }
.mini { height: 6px; background: #E8EEF3; border-radius: 99px; overflow: hidden; }
.mini span { display: block; height: 100%; background: var(--turquesa); }
.mision .pie { margin-top: auto; display: flex; gap: .5rem; flex-wrap: wrap; }
.mision .pie .btn { padding: .55rem .9rem; min-height: 42px; font-size: .9rem; }
.mision.especial { background: linear-gradient(140deg, #fff, var(--turquesa-claro)); border-color: #BDE6E6; }

/* ---------- Desafíos ---------- */
.cabeza-d { display: flex; justify-content: space-between; align-items: center; gap: .8rem; flex-wrap: wrap; margin-bottom: .8rem; }
.tipo { display: inline-flex; align-items: center; gap: .35rem; background: var(--azul); color: #fff; border-radius: 99px; padding: .25rem .8rem; font-size: .78rem; font-weight: 700; letter-spacing: .03em; }
.pasos-d { display: flex; gap: .3rem; }
.pasos-d i { width: 22px; height: 8px; border-radius: 99px; background: #E3E9EF; display: block; }
.pasos-d i.ok { background: var(--verde); }
.pasos-d i.mal { background: #E7A39C; }
.pasos-d i.act { background: var(--turquesa); }
.escena { background: var(--fondo); border-left: 5px solid var(--turquesa); border-radius: 10px; padding: .9rem 1rem; margin: .4rem 0 1rem; display: flex; gap: .8rem; align-items: flex-start; }
.escena svg { width: 28px; height: 28px; color: var(--petroleo); flex: none; margin-top: .1rem; }
.pregunta { font-size: 1.2rem; font-weight: 700; color: var(--texto); margin-bottom: 1rem; }
.opciones { display: grid; gap: .65rem; }
.op { text-align: left; background: #fff; border: 2px solid var(--borde); border-radius: 12px; padding: .85rem 1rem; cursor: pointer; display: flex; gap: .8rem; align-items: flex-start; color: var(--texto); font-size: 1rem; min-height: 52px; transition: border-color .15s, background .15s; }
.op:hover:not([disabled]) { border-color: var(--turquesa); background: #FAFEFE; }
.op .let { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--fondo); color: var(--azul); font-weight: 800; display: grid; place-items: center; font-size: .9rem; }
.op.sel { border-color: var(--azul); background: #F1F6FB; }
.op.sel .let { background: var(--azul); color: #fff; }
.op.bien { border-color: var(--verde); background: var(--verde-claro); }
.op.bien .let { background: var(--verde); color: #fff; }
.op.malo { border-color: var(--rojo); background: var(--rojo-claro); }
.op.malo .let { background: var(--rojo); color: #fff; }
.op[disabled] { cursor: default; }
.op.descartada { opacity: .5; text-decoration: line-through; }
.vf { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
.vf .op { justify-content: center; font-weight: 800; font-size: 1.1rem; }
.acciones { display: flex; gap: .7rem; flex-wrap: wrap; margin-top: 1.1rem; align-items: center; }
.pista-caja { margin-top: .8rem; background: var(--ambar-claro); border: 1px solid #F0D49B; border-radius: 12px; padding: .75rem 1rem; color: #6B440A; display: flex; gap: .6rem; }
.pista-caja svg { width: 22px; height: 22px; flex: none; }

/* ordenar */
.lista-orden { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; }
.lista-orden li { display: flex; align-items: center; gap: .6rem; background: #fff; border: 2px solid var(--borde); border-radius: 12px; padding: .55rem .6rem .55rem .8rem; }
.lista-orden li .n { width: 30px; height: 30px; border-radius: 50%; background: var(--azul); color: #fff; display: grid; place-items: center; font-weight: 800; flex: none; font-size: .9rem; }
.lista-orden li .t { flex: 1; }
.lista-orden li .mv { display: flex; flex-direction: column; gap: .2rem; }
.lista-orden li .mv button { width: 40px; height: 32px; border: 1px solid var(--borde); background: var(--fondo); border-radius: 8px; cursor: pointer; display: grid; place-items: center; color: var(--azul); }
.lista-orden li .mv button svg { width: 18px; height: 18px; }
.lista-orden li .mv button[disabled] { opacity: .3; cursor: default; }
.lista-orden li.bien { border-color: var(--verde); background: var(--verde-claro); }
.lista-orden li.malo { border-color: var(--rojo); background: var(--rojo-claro); }

/* emparejar */
.pares { display: grid; gap: .65rem; }
.par { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; align-items: center; background: #fff; border: 2px solid var(--borde); border-radius: 12px; padding: .6rem .8rem; }
.par select { width: 100%; border: 2px solid var(--borde); border-radius: 10px; padding: .55rem .6rem; background: #fff; color: var(--texto); }
.par.bien { border-color: var(--verde); background: var(--verde-claro); }
.par.malo { border-color: var(--rojo); background: var(--rojo-claro); }
.par .corr { grid-column: 1 / -1; font-size: .88rem; color: #1E6B3E; font-weight: 600; }

/* detectar */
.escena-items { display: grid; gap: .55rem; }
.it { text-align: left; display: flex; gap: .7rem; align-items: flex-start; background: #fff; border: 2px solid var(--borde); border-radius: 12px; padding: .75rem .9rem; cursor: pointer; color: var(--texto); font-size: 1rem; }
.it .caja { width: 26px; height: 26px; border: 2px solid #9FB0C0; border-radius: 7px; flex: none; display: grid; place-items: center; background: #fff; }
.it .caja svg { width: 18px; height: 18px; color: #fff; }
.it[aria-pressed="true"] { border-color: var(--rojo); background: #FFF7F6; }
.it[aria-pressed="true"] .caja { background: var(--rojo); border-color: var(--rojo); }
.it.r-bien { border-color: var(--verde); background: var(--verde-claro); }
.it.r-malo { border-color: var(--rojo); background: var(--rojo-claro); }
.it .exp { display: block; font-size: .88rem; color: var(--tenue); margin-top: .25rem; }
.it[disabled] { cursor: default; }

/* caso ramificado */
.caso-paso { background: var(--fondo); border-radius: 12px; padding: 1rem; margin-bottom: .8rem; border: 1px solid var(--borde); }
.caso-paso .et { font-size: .78rem; font-weight: 800; color: var(--turquesa); text-transform: uppercase; letter-spacing: .06em; }
.consecuencia { background: var(--rojo-claro); border: 1px solid #F1C3BD; border-left: 5px solid var(--rojo); border-radius: 10px; padding: .75rem 1rem; margin: .7rem 0; color: #6E1F17; }
.acierto-caso { background: var(--verde-claro); border: 1px solid #BFE3CC; border-left: 5px solid var(--verde); border-radius: 10px; padding: .75rem 1rem; margin: .7rem 0; color: #1E5233; }

/* contra reloj */
.reloj-caja { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
.anillo { width: 74px; height: 74px; position: relative; flex: none; }
.anillo svg { width: 74px; height: 74px; transform: rotate(-90deg); }
.anillo .num { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 1.35rem; color: var(--azul); }
.anillo circle { fill: none; stroke-width: 7; }
.anillo .fondo { stroke: #E3E9EF; }
.anillo .frente { stroke: var(--turquesa); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.anillo.urgente .frente { stroke: var(--rojo); }

/* retroalimentación */
.fb { margin-top: 1.2rem; border-radius: 14px; padding: 1.1rem 1.2rem; border: 1px solid; animation: entra .35s ease; }
.fb.ok { background: var(--verde-claro); border-color: #BFE3CC; }
.fb.no { background: var(--rojo-claro); border-color: #F1C3BD; }
.fb.medio { background: var(--ambar-claro); border-color: #F0D49B; }
.fb h3 { display: flex; align-items: center; gap: .5rem; margin-bottom: .4rem; }
.fb.ok h3 { color: #1E6B3E; }
.fb.no h3 { color: var(--rojo); }
.fb.medio h3 { color: #7A4F0E; }
.fb h3 svg { width: 26px; height: 26px; }
.fb ul { margin: .3rem 0 .4rem; padding-left: 1.2rem; }
.fb li { margin-bottom: .35rem; }
.puntos-gan { font-weight: 800; font-size: 1.05rem; }
.concepto { margin-top: 1rem; background: #fff; border: 2px solid var(--turquesa); border-radius: 14px; padding: 1rem 1.1rem; position: relative; animation: brilla 1s ease; }
.concepto .et { position: absolute; top: -12px; left: 14px; background: var(--turquesa); color: #fff; font-size: .72rem; font-weight: 800; border-radius: 99px; padding: .15rem .65rem; letter-spacing: .05em; text-transform: uppercase; }
.concepto h4 { margin: .2rem 0 .3rem; color: var(--petroleo); font-size: 1.05rem; }
.fuente { display: inline-block; font-size: .72rem; font-weight: 800; padding: .1rem .5rem; border-radius: 6px; margin-top: .3rem; }
.f-AESP { background: #E4EDF6; color: var(--azul); }
.f-CSG { background: #E6E3F5; color: #3E3577; }
.f-OMS { background: var(--turquesa-claro); color: var(--petroleo); }
.f-General { background: #EEF1F4; color: #46566A; }
.f-Institucional { background: var(--ambar-claro); color: #7A4F0E; }

/* resúmenes y tablas */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .8rem; margin: 1rem 0; }
.kpi { background: var(--fondo); border: 1px solid var(--borde); border-radius: 12px; padding: .8rem 1rem; }
.kpi .v { font-size: 1.6rem; font-weight: 800; color: var(--azul); line-height: 1.1; }
.kpi .l { font-size: .8rem; color: var(--tenue); font-weight: 600; }
.lista-check { list-style: none; padding: 0; margin: 0; display: grid; gap: .45rem; }
.lista-check li { display: flex; gap: .55rem; align-items: flex-start; }
.lista-check li svg { width: 22px; height: 22px; color: var(--verde); flex: none; margin-top: .15rem; }
.conceptos-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .6rem; }
.slot { border: 2px dashed var(--borde); border-radius: 12px; padding: .7rem .8rem; font-size: .88rem; color: #8A99A8; display: flex; gap: .5rem; align-items: center; min-height: 56px; }
.slot svg { width: 20px; height: 20px; flex: none; }
.slot.on { border-style: solid; border-color: #BDE6E6; background: var(--turquesa-claro); color: var(--petroleo); font-weight: 700; }
table.tabla { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.tabla th { background: var(--azul); color: #fff; text-align: left; padding: .55rem .7rem; font-weight: 700; }
table.tabla td { padding: .55rem .7rem; border-bottom: 1px solid var(--borde); vertical-align: top; }
table.tabla tr:nth-child(even) td { background: #F8FAFC; }
.nivel { font-weight: 800; border-radius: 8px; padding: .1rem .5rem; font-size: .82rem; white-space: nowrap; }
.n-exp { background: var(--verde-claro); color: #1E6B3E; }
.n-gua { background: var(--turquesa-claro); color: var(--petroleo); }
.n-pro { background: var(--ambar-claro); color: #7A4F0E; }
.n-ref { background: var(--rojo-claro); color: var(--rojo); }
.insignias { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .7rem; }
.ins { text-align: center; border: 1px solid var(--borde); border-radius: 14px; padding: .9rem .6rem; background: #fff; }
.ins .med { width: 56px; height: 56px; margin: 0 auto .4rem; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--turquesa), var(--verde)); color: #fff; }
.ins .med svg { width: 30px; height: 30px; }
.ins.off { opacity: .45; filter: grayscale(1); }
.ins b { display: block; font-size: .88rem; color: var(--azul); }
.ins small { color: var(--tenue); font-size: .75rem; }

/* modales y avisos */

/* ---------- 2. UTILIDADES ---------- */
const $ = (s) => document.querySelector(s);
const app = () => document.getElementById("app");
function esc(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
/** Permutación determinista (estable entre recargas) de n elementos. */
function perm(n, clave) {
  const a = Array.from({ length: n }, (_, i) => i); let s = hash(clave) || 1;
  for (let i = n - 1; i > 0; i--) { s = (Math.imul(s, 1103515245) + 12345) >>> 0; const j = s % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function permDesordenada(n, clave) { const a = perm(n, clave); if (a.every((v, i) => v === i)) a.push(a.shift()); return a; }
function hms(seg) { seg = Math.max(0, Math.floor(seg)); const h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60), s = seg % 60; return (h ? h + " h " : "") + String(m).padStart(h ? 2 : 1, "0") + " min " + String(s).padStart(2, "0") + " s"; }
function reloj(seg) { seg = Math.max(0, Math.floor(seg)); const h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60), s = seg % 60; return [h, m, s].map((x) => String(x).padStart(2, "0")).join(":"); }
function minTxt(min) { const h = Math.floor(min / 60), m = min % 60; return (h ? h + " h " : "") + (m ? m + " min" : "").trim(); }
function fecha(iso) { try { return new Date(iso).toLocaleString("es-MX", { dateStyle: "long", timeStyle: "short" }); } catch (e) { return iso; } }
function arriba() { window.scrollTo({ top: 0, behavior: "auto" }); }
function fmt(n) { return Number(n || 0).toLocaleString("es-MX"); }

/* ---------- 3. ESTADO Y GUARDADO ---------- */
let S = null;               // estado del participante
let relojInt = null;        // temporizador del desafío contra reloj
let ultimoGuardado = 0;

/* Almacenamiento en tres capas:
   1) Cuenta de Claude (capacidad db, subárbol privado del participante) cuando la página se abre en claude.ai
      y el participante tiene permiso para guardar.
   2) localStorage del navegador (inmediato, también funciona con el archivo descargado).
   3) Archivo de respaldo .json que el participante descarga y vuelve a cargar en cualquier equipo.
   Al iniciar se usa la copia más reciente (campo "mod") entre la cuenta y el navegador. */
const ALM = { listo: false, modo: "local", localOk: true, ref: null, nube: null, dl: null,
  sucio: false, escribiendo: false, timer: null, ultimoNube: 0, aviso: "" };
function probarLocal() { try { const k = CONFIG.claveGuardado + "_prueba"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; } catch (e) { return false; } }
function leerLocal() { try { const t = localStorage.getItem(CONFIG.claveGuardado); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function escribirLocal(o) { try { localStorage.setItem(CONFIG.claveGuardado, JSON.stringify(o)); ALM.localOk = true; return true; } catch (e) { ALM.localOk = false; return false; } }
function conTiempo(prom, ms) { return Promise.race([prom, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))]); }
function valido(o) { return o && typeof o === "object" && typeof o.nombre === "string" && o.m && typeof o.m === "object" && o.fin && o.diag; }

async function iniciarAlmacen() {
  ALM.localOk = probarLocal();
  if (ALM.localOk && navigator.storage && navigator.storage.persist) { navigator.storage.persisted().then((p) => { if (!p) navigator.storage.persist().catch(() => {}); }).catch(() => {}); }
  if (!window.claude || typeof window.claude.use !== "function") { ALM.listo = true; return; }
  try {
    const [db, user, dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
    ALM.dl = dl || null;
    if (db && user) {
      const id = await user.id();
      if (id) {
        const ref = db.doc("data/users/" + id + "/progreso");
        const snap = await conTiempo(ref.get(), 10000);
        ALM.ref = ref; ALM.modo = "nube";
        if (snap.exists) { const d = snap.data(); try { const o = JSON.parse(d.estado); if (valido(o)) ALM.nube = o; } catch (e) { /* copia dañada: se ignora */ } }
      }
    }
  } catch (e) { ALM.modo = "local"; ALM.ref = null; }
  ALM.listo = true;
}
function bajarANivelLocal(msg) { ALM.modo = "local"; ALM.ref = null; ALM.aviso = msg || ""; actualizarChipGuardado(); }
function programarNube() { if (ALM.modo !== "nube") return; ALM.sucio = true; clearTimeout(ALM.timer); ALM.timer = setTimeout(escribirNube, 1500); }
function escribirNube(reintento) {
  if (ALM.modo !== "nube" || !ALM.ref || !S) return;
  if (ALM.escribiendo) { ALM.sucio = true; return; }
  if (!ALM.sucio) return;
  ALM.sucio = false; ALM.escribiendo = true;
  ALM.ref.set({ estado: JSON.stringify(S), mod: S.mod || Date.now(), v: 1 })
    .then(() => { ALM.ultimoNube = Date.now(); ALM.aviso = ""; actualizarChipGuardado(); })
    .catch((e) => {
      const c = (e && e.code) || "unavailable";
      if (c === "unavailable" && !reintento) { ALM.sucio = true; setTimeout(() => escribirNube(true), 1500 + Math.random() * 1500); }
      else if (c === "quota_exceeded") { ALM.sucio = true; ALM.aviso = "La cuenta no tiene espacio para guardar; descargue un respaldo."; actualizarChipGuardado(); }
      else if (c === "resource_exhausted" || c === "unavailable") { ALM.sucio = true; }
      else bajarANivelLocal("Su cuenta no tiene permiso para guardar en esta página; el avance se guarda en este navegador.");
    })
    .finally(() => { ALM.escribiendo = false; if (ALM.sucio && ALM.modo === "nube") programarNube(); });
}
function escribirNubeAhora() { if (ALM.modo === "nube" && ALM.sucio) { clearTimeout(ALM.timer); escribirNube(); } }

function nuevoEstado(nombre) {
  return { v: 1, mod: Date.now(), nombre, creado: new Date().toISOString(), elapsed: 0, pantalla: { n: "menu" },
    diag: { resp: [], hecho: false, i: 0, fb: false }, m: {}, cur: null,
    fin: { i: 0, resp: [], hecho: false, inicio: null, fin: null, fb: false },
    ins: {}, racha: 0, rachaMax: 0 };
}
/** La copia guardada más reciente entre la cuenta y el navegador. */
function cargar() {
  const l = leerLocal(); const loc = valido(l) ? l : null; const n = ALM.nube;
  if (loc && n) return (n.mod || 0) > (loc.mod || 0) ? n : loc;
  return n || loc;
}
/** Guarda el estado. soloLocal: guardado periódico del reloj (no escribe en la cuenta). */
function guardar(opts) {
  if (!S) return;
  ultimoGuardado = Date.now();
  // El reloj solo actualiza el navegador y no cuenta como avance nuevo (no cambia "mod").
  if (opts && opts.soloLocal) { escribirLocal(S); return; }
  S.mod = Date.now(); escribirLocal(S);
  programarNube(); actualizarChipGuardado();
}
function borrar() {
  try { localStorage.removeItem(CONFIG.claveGuardado); } catch (e) { /* sin acción */ }
  ALM.nube = null; clearTimeout(ALM.timer); ALM.sucio = false;
  if (ALM.modo === "nube" && ALM.ref) ALM.ref.delete().catch(() => {});
}
function estadoGuardado() {
  if (ALM.modo === "nube") return { c: "g-nube", ico: "cloud", corto: "Guardado en su cuenta", largo: "Su avance se guarda en su cuenta de Claude y en este navegador. Puede continuar en cualquier equipo abriendo esta misma página con su cuenta." };
  if (ALM.localOk) return { c: "g-local", ico: "device", corto: "Guardado en este navegador", largo: "Su avance se guarda solo en este navegador de este equipo. El navegador puede borrarlo: al limpiar datos de navegación, en ventanas privadas o de incógnito, en Safari tras varios días sin abrir la página, o si abre otra copia del archivo. Descargue un respaldo al terminar cada sesión." };
  return { c: "g-no", ico: "alert", corto: "Sin guardado automático", largo: "Este navegador no permite guardar el avance. Descargue un respaldo antes de cerrar la página y cárguelo la próxima vez." };
}
function actualizarChipGuardado() {
  const b = document.getElementById("bGuardado"); if (!b) return; const e = estadoGuardado();
  b.className = "btn-ico chip-g " + e.c; b.title = e.corto + ". Toque para descargar o cargar un respaldo.";
  b.innerHTML = (I[e.ico] || "") + "<span>" + e.corto + "</span>";
}

/* ---------- Respaldo en archivo ---------- */
function nombreArchivo() {
  const slug = (S.nombre || "participante").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 40);
  const d = new Date(); const f = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  return "Respaldo_MISION_AESP_" + slug + "_" + f + ".json";
}
async function descargarRespaldo() {
  if (!S) return; guardar();
  const datos = JSON.stringify({ app: "MISION_AESP", curso: CONFIG.curso, version: 1, guardado: new Date().toISOString(), estado: S });
  const archivo = nombreArchivo();
  if (ALM.dl) {
    try { await ALM.dl.save({ filename: archivo, data: datos }); avisoBreve("Respaldo descargado: " + archivo); return; }
    catch (e) { const c = e && e.code; if (c === "declined") return; if (c === "rate_limited") { avisoBreve("Ya hay una descarga pendiente de confirmar."); return; } }
  }
  try {
    const url = URL.createObjectURL(new Blob([datos], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = archivo; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    avisoBreve("Respaldo descargado: " + archivo);
  } catch (e) { avisoBreve("Este navegador no permitió descargar el respaldo."); }
}
function cargarRespaldo() {
  const inp = document.getElementById("archivoRespaldo"); if (!inp) return;
  inp.value = ""; inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    if (f.size > 2 * 1024 * 1024) { avisoBreve("El archivo no es un respaldo válido."); return; }
    const lector = new FileReader();
    lector.onload = () => {
      let o = null; try { o = JSON.parse(lector.result); } catch (e) { o = null; }
      const est = o && o.app === "MISION_AESP" && valido(o.estado) ? o.estado : null;
      if (!est) { avisoBreve("El archivo no es un respaldo válido de MISIÓN AESP."); return; }
      const aplicar = () => { S = est; S.cur = null; S.pantalla = { n: "menu" }; guardar(); cerrarModal(); render(); arriba(); avisoBreve("Respaldo cargado: avance de " + S.nombre + "."); };
      if (S) confirmar("Cargar respaldo", "Se reemplazará el avance actual de " + esc(S.nombre) + " por el del respaldo (" + esc(est.nombre) + ", guardado el " + fecha(o.guardado) + ").", "Cargar respaldo", aplicar);
      else aplicar();
    };
    lector.readAsText(f);
  };
  inp.click();
}
function abrirRespaldo() {
  const e = estadoGuardado();
  modal("Guardado y respaldo",
    '<div class="escena">' + (I[e.ico] || "") + '<div><b>' + e.corto + '.</b> ' + esc(e.largo) + (ALM.aviso ? '<br><span style="color:var(--rojo)">' + esc(ALM.aviso) + '</span>' : "") + '</div></div>' +
    '<p>El archivo de respaldo contiene todo su avance (misiones, puntos, insignias y evaluación). Puede cargarlo en esta página o en el archivo del curso, en cualquier equipo.</p>' +
    '<div class="acciones">' + (S ? '<button class="btn btn-p" id="mDesc">' + I.save + ' Descargar respaldo</button>' : "") + '<button class="btn btn-s" id="mCarg">' + I.upload + ' Cargar un respaldo</button></div>',
    () => { const d = $("#mDesc"); if (d) d.onclick = descargarRespaldo; $("#mCarg").onclick = cargarRespaldo; });
}
function avisoBreve(t) {
  const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status");
  d.innerHTML = '<div class="med">' + I.save + '</div><div><b>' + esc(t) + '</b></div>'; document.body.appendChild(d); setTimeout(() => d.remove(), 3800);
}
function M(id) { if (!S.m[id]) S.m[id] = { iniciada: false, idx: 0, res: {}, dom: { ronda: 1, i: 0, resp: [], fb: false, aprobado: false, mejor: 0 }, hecha: false, bono: 0, t: 0, pistas: 0 }; return S.m[id]; }
function ir(n, extra) { S.pantalla = Object.assign({ n }, extra || {}); guardar(); render(); arriba(); }

/* ---------- 4. CÁLCULOS ---------- */
const maxDesafio = (d) => d.tipo === "caso" ? CONFIG.puntos.caso : 100;
const maxMision = (mi) => mi.desafios.reduce((a, d) => a + maxDesafio(d), 0);
function ptsMision(id) { const m = S.m[id]; if (!m) return 0; return Object.values(m.res).reduce((a, r) => a + r.pts, 0); }
function pctMision(id) { const mi = MISIONES[id - 1]; return Math.round(ptsMision(id) / maxMision(mi) * 100); }
function finalCorrectas() { return S.fin.resp.filter((r) => r.ok).length; }
function calificacionFinal() { return S.fin.hecho ? Math.round(finalCorrectas() / EVALUACION.length * 100) : 0; }
function ptsFinal() { return S.fin.hecho ? Math.round(finalCorrectas() / EVALUACION.length * CONFIG.puntos.final) : 0; }
function ptsTotales() { let t = 0; MISIONES.forEach((mi) => { t += ptsMision(mi.id) + ((S.m[mi.id] && S.m[mi.id].bono) || 0); }); return t + ptsFinal(); }
function misionesHechas() { return MISIONES.filter((mi) => S.m[mi.id] && S.m[mi.id].hecha).length; }
function disponible(id) { return id === 1 || (S.m[id - 1] && S.m[id - 1].hecha); }
function progresoGlobal() {
  const total = MISIONES.length * 9 + MISIONES.length + EVALUACION.length; let hecho = 0;
  MISIONES.forEach((mi) => { const m = S.m[mi.id]; if (m) { hecho += Object.keys(m.res).length; if (m.hecha) hecho += 1; } });
  hecho += S.fin.resp.length; return Math.round(hecho / total * 100);
}
function aciertosGlobales() {
  let ok = 0, n = 0; MISIONES.forEach((mi) => { const m = S.m[mi.id]; if (m) Object.values(m.res).forEach((r) => { n++; if (r.ok) ok++; }); });
  S.fin.resp.forEach((r) => { n++; if (r.ok) ok++; });
  return n ? Math.round(ok / n * 100) : 0;
}
function nivel(p) {
  if (p >= 90) return { t: "Experto en seguridad del paciente", c: "n-exp" };
  if (p >= 80) return { t: "Guardián de la seguridad", c: "n-gua" };
  if (p >= 70) return { t: "En proceso de consolidación", c: "n-pro" };
  return { t: "Requiere reforzamiento", c: "n-ref" };
}
function estimadoTotal() { return CONFIG.minutos.introduccion + MISIONES.reduce((a, mi) => a + mi.min, 0) + CONFIG.minutos.final + CONFIG.minutos.cierre; }
function puntosPor(intento, pista) {
  const P = CONFIG.puntos; if (intento === 1) return pista ? P.pista : P.primero; return pista ? P.pistaSegundo : P.segundo;
}
function porAesp(n) { // resultado de la evaluación final por AESP
  let ok = 0, tot = 0; EVALUACION.forEach((q, i) => { if (q.aesp === n) { tot++; const r = S.fin.resp[i]; if (r && r.ok) ok++; } }); return { ok, tot };

function revisarInsignias() {
  const nuevas = []; INSIGNIAS.forEach((b) => { if (!S.ins[b.id] && b.test()) { S.ins[b.id] = new Date().toISOString(); nuevas.push(b); } });

}
function toast(b) {
  const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status");

}
function flotar(pts) {

  d.style.left = "50%"; d.style.top = "120px"; document.body.appendChild(d); setTimeout(() => d.remove(), 1300);

/* ---------- 6. BARRA SUPERIOR Y RELOJ GENERAL ---------- */
function barra() {
  const b = $("#barra"); if (!S || S.pantalla.n === "bienvenida") { b.classList.add("oculto"); return; }
  b.classList.remove("oculto");
  $("#bPts").textContent = fmt(ptsTotales()) + " pts";
  const p = progresoGlobal(); $("#bProg").style.width = p + "%"; $("#bProgT").textContent = p + " % del curso";
  $("#bProgBar").setAttribute("aria-valuenow", p);
  $("#bMis").textContent = misionesHechas() + " de 8 misiones";
  actualizarReloj(); actualizarChipGuardado();
}
function actualizarReloj() { const r = $("#bReloj"); if (r && S) r.textContent = reloj(S.elapsed) + " / " + minTxt(estimadoTotal()); }
function tick() {
  if (!S || document.hidden || S.pantalla.n === "bienvenida") return;
  S.elapsed++; const n = S.pantalla.n;
  if (["intro", "desafio", "resumen", "dominio"].includes(n) && S.pantalla.mid) M(S.pantalla.mid).t++;
  actualizarReloj(); if (Date.now() - ultimoGuardado > 10000) guardar({ soloLocal: true });
}

/* ---------- 7. PANTALLAS ---------- */
function render() {
  if (relojInt) { clearInterval(relojInt); relojInt = null; }
  barra();
  if (!S) return pantallaBienvenida();
  const n = S.pantalla.n;
  const mapa = { bienvenida: pantallaBienvenida, menu: pantallaMenu, instrucciones: pantallaInstrucciones, intro: pantallaIntro, desafio: pantallaDesafio,
    resumen: pantallaResumen, dominio: pantallaDominio, diag: pantallaDiagnostico, final: pantallaFinal, reporte: pantallaReporte, revision: pantallaRevision, fuentes: pantallaFuentes };

}

/* ---------- 8. DESAFÍOS ---------- */
function curActual(mid, k) {
  if (!S.cur || S.cur.mid !== mid || S.cur.k !== k) {
    const d = MISIONES[mid - 1].desafios[k];
    S.cur = { mid, k, intento: 1, pista: false, fase: "resp", desc: [], sel: null, parcial: null, marcas: [], pares: {}, orden: null,
      caso: { paso: 0, primeros: [], intentosPaso: 0, fb: null, elegidas: [] }, reloj: { i: 0, res: [], resta: d.seg || 20, fase: "listo", fb: null } };
    if (d.tipo === "ordena") S.cur.orden = permDesordenada(d.pasos.length, "o" + mid + "-" + k);
    guardar();
  }
  return S.cur;
}
function cabezaDesafio(mi, k, d) {
  const m = S.m[mi.id];
  const dots = mi.desafios.map((_, j) => { const r = m.res[j]; return '<i class="' + (r ? (r.ok ? "ok" : "mal") : (j === k ? "act" : "")) + '"></i>'; }).join("");
  return '<div class="cabeza-d"><div><div class="kicker">Misión ' + mi.id + ' · ' + esc(mi.corto || mi.titulo) + ' · Desafío ' + (k + 1) + ' de 9</div>' +
    '<span class="tipo">' + TIPOS[d.tipo] + '</span></div><div><div class="pasos-d" aria-label="Avance de la misión">' + dots + '</div>' +
    '<div class="tenue" style="font-size:.8rem;text-align:right;margin-top:.3rem">Misión: ' + fmt(ptsMision(mi.id)) + ' / ' + fmt(maxMision(mi)) + ' pts</div></div></div>';
}
function cajaEscena(t) { return t ? '<div class="escena">' + I.scene + '<div>' + esc(t) + '</div></div>' : ""; }
function tarjetaConcepto(c) {
  return '<div class="concepto"><span class="et">Nuevo concepto en su glosario</span><h4>' + esc(c[0]) + '</h4><p style="margin:0">' + esc(c[1]) + '</p><span class="fuente f-' + c[2] + '">' + FUENTE_ET[c[2]] + '</span></div>';
}
function botonesDesafio(d, c, puedeComprobar) {
  const conPista = !!d.pista && d.tipo !== "caso" && d.tipo !== "reloj";
  let h = '<div class="acciones">';
  if (c.fase === "resp") {
    if (d.tipo !== "caso" && d.tipo !== "reloj") h += '<button class="btn btn-p" id="bComp"' + (puedeComprobar ? "" : " disabled") + '>Comprobar</button>';
    if (conPista)
      h += '<button class="btn btn-pista" id="bPista"' + (c.pista ? " disabled" : "") + '>' + I.bulb + (c.pista ? " Pista utilizada" : " Necesito una pista") + '</button>';
  } else {
    const ult = c.k >= 8;
    h += '<button class="btn btn-t" id="bSig">' + (ult ? "Ver resumen de la misión" : "Siguiente desafío") + '</button>';
  }
  h += '<button class="btn btn-s" id="bSalir">Guardar y salir al menú</button></div>';
  if (c.pista && c.fase === "resp") h += '<div class="pista-caja">' + I.bulb + '<div><b>Pista:</b> ' + esc(d.pista) + ' <span class="tenue">(puntaje máximo de este desafío: ' + (c.intento === 1 ? CONFIG.puntos.pista : CONFIG.puntos.pistaSegundo) + ' pts)</span></div></div>';
  return h;
}
function enlazarComunes(mi, d, c, comprobar) {
  const bC = $("#bComp"); if (bC) bC.onclick = comprobar;
  const bP = $("#bPista"); if (bP) bP.onclick = () => { c.pista = true; M(mi.id).pistas++; guardar(); render(); };
  const bS = $("#bSig"); if (bS) bS.onclick = () => siguienteDesafio(mi);
  $("#bSalir").onclick = () => ir("menu");
}
function siguienteDesafio(mi) {
  const m = M(mi.id); m.idx = Object.keys(m.res).length; S.cur = null;
  if (m.idx >= 9) ir("resumen", { mid: mi.id }); else ir("desafio", { mid: mi.id });
}
/** Registra el resultado definitivo de un desafío y calcula los puntos. */
function cerrarDesafio(mi, k, pts, ok, extra) {
  const c = S.cur; const m = M(mi.id);
  m.res[k] = Object.assign({ pts, max: maxDesafio(mi.desafios[k]), ok, intento: c.intento, pista: c.pista }, extra || {});
  if (ok) { S.racha++; S.rachaMax = Math.max(S.rachaMax, S.racha); } else S.racha = 0;
  c.fase = "fb"; guardar(); flotar(pts); revisarInsignias();
}
function fbParcial(c) {
  return c.parcial ? '<div class="fb medio" role="status"><h3 tabindex="-1">' + I.bulb + ' Aún no</h3>' + c.parcial + '<p style="margin:0"><b>Tiene un segundo intento</b> (vale hasta ' + (c.pista ? CONFIG.puntos.pistaSegundo : CONFIG.puntos.segundo) + ' pts).</p></div>' : "";
}
function fbFinal(ok, pts, max, cuerpo, concepto) {
  return '<div class="fb ' + (ok ? "ok" : (pts > 0 ? "medio" : "no")) + '" role="status"><h3 tabindex="-1">' + (ok ? I.ok + " ¡Correcto!" : (pts > 0 ? I.ok + " Resuelto" : I.no + " Respuesta incorrecta")) +
    ' <span class="puntos-gan" style="margin-left:auto">+' + pts + ' / ' + max + ' pts</span></h3>' + cuerpo + '</div>' + tarjetaConcepto(concepto);
}
function enfocarFb() { const h = app().querySelector(".fb h3"); if (h) { h.focus({ preventScroll: true }); h.closest(".fb").scrollIntoView({ behavior: "smooth", block: "nearest" }); } }

function pantallaDesafio() {
  const mi = MISIONES[S.pantalla.mid - 1]; const m = M(mi.id);
  if (!disponible(mi.id)) return ir("menu");
  // Desafío actual: el que muestra retroalimentación pendiente o el primero sin resolver
  const k = (S.cur && S.cur.mid === mi.id && S.cur.fase === "fb") ? S.cur.k : Object.keys(m.res).length;
  if (k >= 9) return ir("resumen", { mid: mi.id });
  const d = mi.desafios[k]; const c = curActual(mi.id, k);
  m.iniciada = true;
  const R = { acertijo: dMultiple, primero: dMultiple, vf: dVF, detecta: dDetecta, ordena: dOrdena, empareja: dEmpareja, caso: dCaso, reloj: dReloj };
  R[d.tipo](mi, k, d, c);
  if (c.fase === "fb" || c.parcial) setTimeout(enfocarFb, 30);
}

/* --- Opción múltiple (acertijo y ¿qué harías primero?) --- */
function dMultiple(mi, k, d, c) {
  const orden = perm(d.ops.length, "m" + mi.id + "-" + k); const r = S.m[mi.id].res[k]; const fin = c.fase === "fb";
  let ops = '<div class="opciones" role="radiogroup">';
  orden.forEach((oi, pos) => {
    let cls = "op"; if (!fin && c.sel === oi) cls += " sel"; if (c.desc.includes(oi)) cls += " descartada malo";
    if (fin) { if (oi === 0) cls += " bien"; else if (r && r.resp === oi) cls += " malo"; }
    ops += '<button class="' + cls + '" data-o="' + oi + '" role="radio" aria-checked="' + (c.sel === oi) + '"' + (fin || c.desc.includes(oi) ? " disabled" : "") + '><span class="let">' + LETRAS[pos] + '</span><span>' + esc(d.ops[oi][0]) + '</span></button>';
  });
  ops += '</div>';
  let fb = "";
  if (fin) {
    const otras = orden.filter((oi) => oi !== 0).map((oi) => '<li><b>' + esc(d.ops[oi][0]) + ':</b> ' + esc(d.ops[oi][1]) + '</li>').join("");
    fb = fbFinal(r.ok, r.pts, r.max, '<p><b>Opción segura:</b> ' + esc(d.ops[0][0]) + '. ' + esc(d.ops[0][1]) + '</p><p style="margin-bottom:.2rem"><b>Riesgo de las otras opciones:</b></p><ul>' + otras + '</ul>', d.concepto);
  }
  app().innerHTML = '<div class="tarjeta">' + cabezaDesafio(mi, k, d) + '<h2>' + esc(d.titulo) + '</h2>' + cajaEscena(d.esc) + '<div class="pregunta">' + esc(d.q) + '</div>' + ops + fbParcial(c) + fb + botonesDesafio(d, c, c.sel !== null) + '</div>';
  app().querySelectorAll(".op[data-o]").forEach((b) => b.onclick = () => { c.sel = +b.dataset.o; c.parcial = null; guardar(); render(); });
  enlazarComunes(mi, d, c, () => {
    if (c.sel === null) return;
    if (c.sel === 0) { cerrarDesafio(mi, k, puntosPor(c.intento, c.pista), c.intento === 1, { resp: 0 }); }
    else if (c.intento === 1) { c.parcial = '<p>' + esc(d.ops[c.sel][1]) + '</p>'; c.desc.push(c.sel); c.intento = 2; c.sel = null; guardar(); }
    else { cerrarDesafio(mi, k, 0, false, { resp: c.sel }); }
    render();
  });
}

/* --- Verdadero o falso con justificación (un solo intento) --- */
function dVF(mi, k, d, c) {
  const r = S.m[mi.id].res[k]; const fin = c.fase === "fb";
  const b = (v, t) => { let cls = "op"; if (!fin && c.sel === v) cls += " sel"; if (fin) { if (v === d.ok) cls += " bien"; else if (r.resp === v) cls += " malo"; }
    return '<button class="' + cls + '" data-v="' + v + '"' + (fin ? " disabled" : "") + ' aria-pressed="' + (c.sel === v) + '">' + t + '</button>'; };
  let fb = ""; if (fin) fb = fbFinal(r.ok, r.pts, r.max, '<p>' + esc(d.exp) + '</p>', d.concepto);
  app().innerHTML = '<div class="tarjeta">' + cabezaDesafio(mi, k, d) + '<h2>' + esc(d.titulo) + '</h2>' + cajaEscena(d.esc) +
    '<div class="pregunta">«' + esc(d.q) + '»</div><div class="vf">' + b(true, "Verdadero") + b(false, "Falso") + '</div>' +
    '<p class="tenue" style="margin-top:.6rem;font-size:.9rem">Este desafío tiene un solo intento. Al responder verá la justificación.</p>' + fb + botonesDesafio(d, c, c.sel !== null) + '</div>';
  app().querySelectorAll("[data-v]").forEach((x) => x.onclick = () => { c.sel = x.dataset.v === "true"; guardar(); render(); });
  enlazarComunes(mi, d, c, () => { if (c.sel === null) return; const ok = c.sel === d.ok; cerrarDesafio(mi, k, ok ? puntosPor(1, c.pista) : 0, ok, { resp: c.sel }); render(); });
}

/* --- Detecta el error --- */
function dDetecta(mi, k, d, c) {
  const orden = perm(d.items.length, "d" + mi.id + "-" + k); const fin = c.fase === "fb"; const r = S.m[mi.id].res[k];
  const nErr = d.items.filter((x) => x[1]).length;
  let h = '<p class="tenue">Hay <b>' + nErr + '</b> acciones inseguras. Toque cada una para marcarla.</p><div class="escena-items">';
  orden.forEach((ii) => {
    const it = d.items[ii]; const marcado = c.marcas.includes(ii); let cls = "it";
    if (fin) cls += (it[1] === marcado) ? " r-bien" : " r-malo";
    h += '<button class="' + cls + '" data-i="' + ii + '" aria-pressed="' + marcado + '"' + (fin ? " disabled" : "") + '><span class="caja">' + (marcado ? I.tick : "") + '</span><span>' + esc(it[0]) +
      (fin ? '<span class="exp"><b>' + (it[1] ? "Acción insegura. " : "Acción segura. ") + '</b>' + esc(it[2]) + '</span>' : "") + '</span></button>';
  });
  h += '</div>';
  let fb = ""; if (fin) fb = fbFinal(r.ok, r.pts, r.max, '<p>' + (r.ok ? "Identificó todas las acciones inseguras sin marcar acciones seguras." : "Revise en la lista la explicación de cada acción: en verde lo que debía marcarse o dejarse sin marcar correctamente, en rojo lo que no.") + '</p>', d.concepto);
  app().innerHTML = '<div class="tarjeta">' + cabezaDesafio(mi, k, d) + '<h2>' + esc(d.titulo) + '</h2>' + cajaEscena(d.esc) + h + fbParcial(c) + fb + botonesDesafio(d, c, c.marcas.length > 0) + '</div>';
  app().querySelectorAll(".it[data-i]").forEach((b) => b.onclick = () => { const i = +b.dataset.i; const p = c.marcas.indexOf(i); if (p >= 0) c.marcas.splice(p, 1); else c.marcas.push(i); c.parcial = null; guardar(); render(); });
  enlazarComunes(mi, d, c, () => {
    const E = d.items.map((x, i) => x[1] ? i : -1).filter((i) => i >= 0);
    const hits = c.marcas.filter((i) => E.includes(i)).length; const falsos = c.marcas.filter((i) => !E.includes(i)).length;
    const ok = hits === E.length && falsos === 0;
    if (ok) cerrarDesafio(mi, k, puntosPor(c.intento, c.pista), c.intento === 1, { resp: c.marcas.slice() });
    else if (c.intento === 1) { c.parcial = '<p>Identificó <b>' + hits + ' de ' + E.length + '</b> acciones inseguras' + (falsos ? ' y marcó <b>' + falsos + '</b> acción(es) segura(s) como error' : "") + '.</p>'; c.intento = 2; guardar(); }
    else cerrarDesafio(mi, k, 0, false, { resp: c.marcas.slice() });
    render();
  });
}

/* --- Ordena los pasos --- */
function dOrdena(mi, k, d, c) {
  const fin = c.fase === "fb"; const r = S.m[mi.id].res[k]; const n = c.orden.length;
  let h = '<p class="tenue">Use las flechas para mover cada paso a su lugar.</p><ol class="lista-orden">';
  c.orden.forEach((pi, pos) => {
    const cls = fin ? (pi === pos ? "bien" : "malo") : "";
    h += '<li class="' + cls + '"><span class="n">' + (pos + 1) + '</span><span class="t">' + esc(d.pasos[pi]) + '</span>' + (fin ? "" :
      '<span class="mv"><button data-up="' + pos + '" aria-label="Subir paso"' + (pos === 0 ? " disabled" : "") + '>' + I.up + '</button><button data-dn="' + pos + '" aria-label="Bajar paso"' + (pos === n - 1 ? " disabled" : "") + '>' + I.down + '</button></span>') + '</li>';
  });
  h += '</ol>';
  let fb = ""; if (fin) fb = fbFinal(r.ok, r.pts, r.max, (r.ok ? "" : '<p><b>Orden correcto:</b></p><ol>' + d.pasos.map((p) => '<li>' + esc(p) + '</li>').join("") + '</ol>') + '<p>' + esc(d.exp) + '</p>', d.concepto);
  app().innerHTML = '<div class="tarjeta">' + cabezaDesafio(mi, k, d) + '<h2>' + esc(d.titulo) + '</h2>' + cajaEscena(d.esc) + '<div class="pregunta">' + esc(d.q) + '</div>' + h + fbParcial(c) + fb + botonesDesafio(d, c, true) + '</div>';
  const mover = (a, b) => { [c.orden[a], c.orden[b]] = [c.orden[b], c.orden[a]]; c.parcial = null; guardar(); render(); const t = app().querySelector('[data-' + (b < a ? "up" : "dn") + '="' + b + '"]') || app().querySelector('[data-up="' + b + '"]'); if (t && !t.disabled) t.focus(); };
  app().querySelectorAll("[data-up]").forEach((b) => b.onclick = () => { const p = +b.dataset.up; if (p > 0) mover(p, p - 1); });
  app().querySelectorAll("[data-dn]").forEach((b) => b.onclick = () => { const p = +b.dataset.dn; if (p < n - 1) mover(p, p + 1); });
  enlazarComunes(mi, d, c, () => {
    const bien = c.orden.filter((pi, pos) => pi === pos).length; const ok = bien === n;
    if (ok) cerrarDesafio(mi, k, puntosPor(c.intento, c.pista), c.intento === 1, { resp: c.orden.slice() });
    else if (c.intento === 1) { c.parcial = '<p><b>' + bien + ' de ' + n + '</b> pasos están en su posición correcta.</p>'; c.intento = 2; guardar(); }
    else cerrarDesafio(mi, k, 0, false, { resp: c.orden.slice() });
    render();
  });
}

/* --- Emparejamiento --- */
function dEmpareja(mi, k, d, c) {
  const fin = c.fase === "fb"; const r = S.m[mi.id].res[k];
  const unicas = [...new Set(d.pares.map((p) => p[1]))]; const ordU = perm(unicas.length, "u" + mi.id + "-" + k).map((i) => unicas[i]);
  const ordI = perm(d.pares.length, "e" + mi.id + "-" + k);
  let h = '<div class="pares">';
  ordI.forEach((pi) => {
    const p = d.pares[pi]; const v = c.pares[pi] || ""; const cls = fin ? (v === p[1] ? " bien" : " malo") : "";
    h += '<div class="par' + cls + '"><label for="s' + pi + '" style="margin:0;color:var(--texto);font-weight:600">' + esc(p[0]) + '</label><select id="s' + pi + '" data-p="' + pi + '"' + (fin ? " disabled" : "") + '><option value="">Seleccione…</option>' +
      ordU.map((u) => '<option' + (u === v ? " selected" : "") + '>' + esc(u) + '</option>').join("") + '</select>' + (fin && v !== p[1] ? '<div class="corr">Correcto: ' + esc(p[1]) + '</div>' : "") + '</div>';
  });
  h += '</div>';
  const completos = d.pares.every((_, i) => c.pares[i]);
  let fb = ""; if (fin) fb = fbFinal(r.ok, r.pts, r.max, '<p>' + esc(d.exp) + '</p>', d.concepto);
  app().innerHTML = '<div class="tarjeta">' + cabezaDesafio(mi, k, d) + '<h2>' + esc(d.titulo) + '</h2>' + cajaEscena(d.esc) + '<div class="pregunta">' + esc(d.q) + '</div>' + h + fbParcial(c) + fb + botonesDesafio(d, c, completos) + '</div>';
  app().querySelectorAll("select[data-p]").forEach((s) => s.onchange = () => { c.pares[+s.dataset.p] = s.value; c.parcial = null; guardar(); const id = s.id; render(); const n = document.getElementById(id); if (n) n.focus(); });
  enlazarComunes(mi, d, c, () => {
    const bien = d.pares.filter((p, i) => c.pares[i] === p[1]).length; const ok = bien === d.pares.length;
    if (ok) cerrarDesafio(mi, k, puntosPor(c.intento, c.pista), c.intento === 1, { resp: Object.assign({}, c.pares) });
    else if (c.intento === 1) { c.parcial = '<p><b>' + bien + ' de ' + d.pares.length + '</b> relaciones son correctas.</p>'; c.intento = 2; guardar(); }
    else cerrarDesafio(mi, k, 0, false, { resp: Object.assign({}, c.pares) });
    render();
  });
}

/* --- Caso clínico ramificado --- */
function dCaso(mi, k, d, c) {
  const cs = c.caso; const fin = c.fase === "fb"; const r = S.m[mi.id].res[k]; const n = d.pasos.length;
  let h = "";
  d.pasos.forEach((p, i) => {
    if (i > cs.paso && !fin) return;
    h += '<div class="caso-paso"><div class="et">Decisión ' + (i + 1) + ' de ' + n + '</div><p style="margin:.3rem 0 .7rem">' + esc(p.txt) + '</p>';
    if (i < cs.paso || fin) {
      const el = cs.elegidas[i]; if (el != null) h += '<div class="acierto-caso"><b>Su decisión:</b> ' + esc(p.ops[el][0]) + '</div>';
    } else {
      const orden = perm(p.ops.length, "c" + mi.id + "-" + k + "-" + i);
      h += '<div class="opciones">' + orden.map((oi, pos) => {
        const yaMal = cs.fb && cs.fb.malas && cs.fb.malas.includes(oi);
        return '<button class="op' + (yaMal ? " descartada malo" : "") + '" data-c="' + oi + '"' + (yaMal || (cs.fb && cs.fb.segura) ? " disabled" : "") + '><span class="let">' + LETRAS[pos] + '</span><span>' + esc(p.ops[oi][0]) + '</span></button>';
      }).join("") + '</div>';
      if (cs.fb && cs.fb.txt) h += cs.fb.segura ? '<div class="acierto-caso" role="status">' + esc(cs.fb.txt) + '</div><div class="acciones"><button class="btn btn-t" id="bCont">' + (i === n - 1 ? "Concluir el caso" : "Continuar el caso") + '</button></div>'
        : '<div class="consecuencia" role="status">' + esc(cs.fb.txt) + '<br><b>Elija otra decisión.</b></div>';
    }
    h += '</div>';
  });
  let fb = "";
  if (fin) { const seg = cs.primeros.filter(Boolean).length; fb = fbFinal(r.ok, r.pts, r.max, '<p>' + esc(d.fin) + '</p><p>Decisiones seguras al primer intento: <b>' + seg + ' de ' + n + '</b>. Cada decisión segura al primer intento vale ' + Math.round(CONFIG.puntos.caso / n) + ' pts.</p>', d.concepto); }
  app().innerHTML = '<div class="tarjeta">' + cabezaDesafio(mi, k, d) + '<h2>' + esc(d.titulo) + '</h2><p class="tenue">Sus decisiones cambian el desarrollo del caso. Las decisiones inseguras muestran una consecuencia simulada.</p>' + h + fb + botonesDesafio(d, c, false) + '</div>';
  app().querySelectorAll("[data-c]").forEach((b) => b.onclick = () => {
    const oi = +b.dataset.c; const op = d.pasos[cs.paso].ops[oi];
    if (!cs.fb) cs.fb = { malas: [] };
    if (op[1]) { if (cs.primeros[cs.paso] === undefined) cs.primeros[cs.paso] = cs.intentosPaso === 0; cs.elegidas[cs.paso] = oi; cs.fb.segura = true; cs.fb.txt = op[2]; }
    else { cs.intentosPaso++; cs.fb.malas.push(oi); cs.fb.segura = false; cs.fb.txt = op[2]; }
    guardar(); render(); const x = app().querySelector(".acierto-caso[role=status], .consecuencia"); if (x) x.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
  const bc = $("#bCont"); if (bc) bc.onclick = () => {
    cs.paso++; cs.intentosPaso = 0; cs.fb = null;
    if (cs.paso >= n) { const seg = cs.primeros.filter(Boolean).length; c.intento = seg === n ? 1 : 2; cerrarDesafio(mi, k, Math.round(CONFIG.puntos.caso * seg / n), seg === n, { resp: cs.elegidas.slice(), seguras: seg }); }
    else guardar();
    render();
  };
  enlazarComunes(mi, d, c, null);
}

/* --- Desafío contra reloj --- */
function dReloj(mi, k, d, c) {
  const rl = c.reloj; const n = d.items.length; const fin = c.fase === "fb"; const r = S.m[mi.id].res[k];
  let h = "";
  if (fin) {
    h = '<table class="tabla"><thead><tr><th>Afirmación</th><th>Respuesta correcta</th><th>Resultado</th></tr></thead><tbody>' +
      d.items.map((it, i) => '<tr><td>' + esc(it[0]) + '<br><span class="tenue" style="font-size:.88rem">' + esc(it[2]) + '</span></td><td>' + (it[1] ? "Verdadero" : "Falso") + '</td><td>' + (rl.res[i] === "t" ? "Tiempo agotado" : (rl.res[i] ? "Correcta" : "Incorrecta")) + '</td></tr>').join("") + '</tbody></table>';
    h += fbFinal(r.ok, r.pts, r.max, '<p>Respondió correctamente y a tiempo <b>' + rl.res.filter((x) => x === true).length + ' de ' + n + '</b> afirmaciones.</p>', d.concepto);
  } else if (rl.fase === "listo") {
    h = '<p>Responderá <b>' + n + ' afirmaciones</b> de verdadero o falso, con <b>' + d.seg + ' segundos</b> para cada una. Cada acierto a tiempo vale ' + CONFIG.puntos.relojItem + ' pts. Después de cada respuesta verá la explicación: el tiempo no le quita la oportunidad de aprender.</p>' +
      '<div class="acciones"><button class="btn btn-p" id="bGo">' + I.clock + ' Iniciar el reloj</button></div>';
  } else {
    const it = d.items[rl.i]; const C = 2 * Math.PI * 30;
    h = '<div class="reloj-caja"><div class="anillo' + (rl.resta <= 5 ? " urgente" : "") + '" id="anillo"><svg viewBox="0 0 74 74"><circle class="fondo" cx="37" cy="37" r="30"/><circle class="frente" id="arco" cx="37" cy="37" r="30" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - rl.resta / d.seg)) + '"/></svg><div class="num" id="seg">' + rl.resta + '</div></div>' +
      '<div><div class="kicker">Afirmación ' + (rl.i + 1) + ' de ' + n + '</div><div class="pregunta" style="margin:0">«' + esc(it[0]) + '»</div></div></div>';
    if (rl.fase === "corriendo") h += '<div class="vf"><button class="op" data-rv="true">Verdadero</button><button class="op" data-rv="false">Falso</button></div>';
    else {
      const res = rl.res[rl.i]; const cls = res === true ? "ok" : "no";
      h += '<div class="fb ' + cls + '" role="status"><h3 tabindex="-1">' + (res === true ? I.ok + " Correcto" : (res === "t" ? I.no + " Tiempo agotado" : I.no + " Incorrecto")) + '</h3><p style="margin:0"><b>' + (it[1] ? "Verdadero." : "Falso.") + '</b> ' + esc(it[2]) + '</p></div>' +
        '<div class="acciones"><button class="btn btn-t" id="bRsig">' + (rl.i === n - 1 ? "Ver resultado" : "Siguiente afirmación") + '</button></div>';
    }
  }
  app().innerHTML = '<div class="tarjeta">' + cabezaDesafio(mi, k, d) + '<h2>' + esc(d.titulo) + '</h2>' + h + botonesDesafio(d, c, false) + '</div>';
  const go = $("#bGo"); if (go) go.onclick = () => { rl.fase = "corriendo"; rl.resta = d.seg; guardar(); render(); };
  const responder = (v) => { if (relojInt) { clearInterval(relojInt); relojInt = null; } rl.res[rl.i] = v === "t" ? "t" : (v === d.items[rl.i][1]); rl.fase = "fb"; guardar(); render(); setTimeout(enfocarFb, 20); };
  app().querySelectorAll("[data-rv]").forEach((b) => b.onclick = () => responder(b.dataset.rv === "true"));
  const bs = $("#bRsig"); if (bs) bs.onclick = () => {
    if (rl.i >= n - 1) { const okN = rl.res.filter((x) => x === true).length; c.intento = 1; cerrarDesafio(mi, k, okN * CONFIG.puntos.relojItem, okN >= n - 1, { resp: rl.res.slice() }); render(); }
    else { rl.i++; rl.resta = d.seg; rl.fase = "corriendo"; guardar(); render(); }
  };
  if (rl.fase === "corriendo" && !fin) {
    const C = 2 * Math.PI * 30;
    relojInt = setInterval(() => {
      if (document.hidden) return; rl.resta--; const s = $("#seg"), a = $("#arco"), an = $("#anillo");
      if (s) s.textContent = Math.max(0, rl.resta); if (a) a.setAttribute("stroke-dashoffset", C * (1 - Math.max(0, rl.resta) / d.seg)); if (an && rl.resta <= 5) an.classList.add("urgente");
      if (rl.resta <= 0) responder("t");
    }, 1000);
  }
  enlazarComunes(mi, d, c, null);
}

/* ---------- Resumen de misión ---------- */

  const mi = MISIONES[S.pantalla.mid - 1]; const m = M(mi.id);
  if (Object.keys(m.res).length < 9) return ir("intro", { mid: mi.id });
  const pts = ptsMision(mi.id), pct = pctMision(mi.id), nv = nivel(pct);
  const prim = Object.values(m.res).filter((r) => r.ok).length;
  let h = '<div class="tarjeta"><div class="kicker">Misión ' + mi.id + ' · Resumen de aprendizaje</div><h1>' + esc(mi.titulo) + '</h1>' +
    '<div class="kpis"><div class="kpi"><div class="v">' + fmt(pts) + '</div><div class="l">de ' + fmt(maxMision(mi)) + ' puntos</div></div>' +
    '<div class="kpi"><div class="v">' + pct + ' %</div><div class="l">Desempeño en la misión</div></div>' +
    '<div class="kpi"><div class="v">' + prim + '/9</div><div class="l">Aciertos al primer intento</div></div>' +
    '<div class="kpi"><div class="v">' + m.pistas + '</div><div class="l">Pistas utilizadas</div></div>' +
    '<div class="kpi"><div class="v" style="font-size:1.15rem">' + hms(m.t) + '</div><div class="l">Tiempo en la misión</div></div></div>' +
    '<p>Nivel en esta misión: <span class="nivel ' + nv.c + '">' + nv.t + '</span></p>' +
    '<h2>Lo que debe recordar</h2><ul class="lista-check">' + mi.resumen.map((t) => '<li>' + I.ok + '<span>' + esc(t) + '</span></li>').join("") + '</ul>' +
    '<h2 style="margin-top:1.2rem">Conceptos desbloqueados</h2><div class="conceptos-slots">' + mi.desafios.map((d) => '<div class="slot on">' + I.tick + esc(d.concepto[0]) + '</div>').join("") + '</div>';
  if (m.hecha) h += '<div class="fb ok" style="margin-top:1.2rem"><h3>' + I.trophy + ' Misión completada</h3><p style="margin:0">Aprobó la evaluación de dominio' + (m.bono ? ' y recibió +' + m.bono + ' puntos de bonificación' : '') + '.</p></div>' +
    '<div class="acciones"><button class="btn btn-p" id="bMenu">Volver al menú</button><button class="btn btn-s" id="bRev">Revisar respuestas</button></div>';
  else h += '<div class="escena" style="margin-top:1.2rem">' + I.learn + '<div><b>Evaluación de dominio.</b> Tres preguntas para comprobar que domina la misión. Necesita ' + CONFIG.dominioMinimo + ' aciertos para completarla y desbloquear la siguiente; si no los obtiene, podrá repasar y volver a intentarlo.</div></div>' +
    '<div class="acciones"><button class="btn btn-p" id="bDom">' + I.play + ' Iniciar evaluación de dominio</button><button class="btn btn-s" id="bRev">Revisar mis respuestas</button><button class="btn btn-s" id="bMenu">Guardar y salir al menú</button></div>';
  h += '</div>';

  const q = (s, f) => { const e = $(s); if (e) e.onclick = f; };
  q("#bDom", () => ir("dominio", { mid: mi.id })); q("#bMenu", () => ir("menu")); q("#bRev", () => ir("revision", { mid: mi.id }));
}

/* ---------- 9. EVALUACIÓN DE DOMINIO ---------- */
function pantallaDominio() {
  const mi = MISIONES[S.pantalla.mid - 1]; const m = M(mi.id); const dm = m.dom;
  if (Object.keys(m.res).length < 9) return ir("intro", { mid: mi.id });
  if (m.hecha && dm.i >= mi.dominio.length) return ir("resumen", { mid: mi.id });
  let h = '<div class="tarjeta"><div class="kicker">Misión ' + mi.id + ' · Evaluación de dominio · intento ' + dm.ronda + '</div>';
  if (dm.i >= mi.dominio.length) {
    const ok = dm.resp.filter((r) => r.ok).length;
    if (ok >= CONFIG.dominioMinimo) {
      if (!m.hecha) { m.hecha = true; m.bono = CONFIG.puntos.bono; dm.aprobado = true; guardar(); flotar(m.bono); revisarInsignias(); barra(); }
      const sig = MISIONES[mi.id];
      h += '<h1>¡Misión completada!</h1><div class="fb ok"><h3>' + I.trophy + ' Dominio aprobado: ' + ok + '/' + mi.dominio.length + '</h3><p style="margin:0">Recibió +' + CONFIG.puntos.bono + ' puntos de bonificación.' + (sig ? ' Se desbloqueó la Misión ' + sig.id + ': ' + esc(sig.titulo) + '.' : ' Completó las ocho misiones: la evaluación final está disponible.') + '</p></div>' +
        (ALM.modo !== "nube" ? '<div class="escena">' + I.device + '<div>Su avance se guarda solo en este navegador. Le recomendamos <b>descargar un respaldo</b> ahora para no perderlo.</div></div>' : "") +
        '<div class="acciones">' + (sig ? '<button class="btn btn-p" id="bSigM">' + I.play + ' Ir a la Misión ' + sig.id + '</button>' : '<button class="btn btn-p" id="bFinal">' + I.trophy + ' Ir a la evaluación final</button>') +
        (ALM.modo !== "nube" ? '<button class="btn btn-s" id="bDescR">' + I.save + ' Descargar respaldo</button>' : "") + '<button class="btn btn-s" id="bMenu">Volver al menú</button></div>';
    } else {
      h += '<h1>Requiere repaso</h1><div class="fb no"><h3>' + I.no + ' Obtuvo ' + ok + ' de ' + mi.dominio.length + '</h3><p style="margin:0">Necesita al menos ' + CONFIG.dominioMinimo + ' aciertos. Repase el resumen y los conceptos de la misión y vuelva a intentarlo; las opciones aparecerán en otro orden.</p></div>' +
        '<div class="acciones"><button class="btn btn-p" id="bOtra">Volver a intentarlo</button><button class="btn btn-s" id="bRes">Repasar el resumen</button></div>';
    }
  } else {
    const q = mi.dominio[dm.i]; const orden = perm(q.ops.length, "dom" + mi.id + "-" + dm.i + "-" + dm.ronda); const r = dm.resp[dm.i];
    h += '<h2>Pregunta ' + (dm.i + 1) + ' de ' + mi.dominio.length + '</h2><div class="pregunta">' + esc(q.q) + '</div><div class="opciones">' +
      orden.map((oi, pos) => { let cls = "op"; if (!dm.fb && dm.sel === oi) cls += " sel"; if (dm.fb) { if (oi === 0) cls += " bien"; else if (r && r.sel === oi) cls += " malo"; }
        return '<button class="' + cls + '" data-o="' + oi + '"' + (dm.fb ? " disabled" : "") + '><span class="let">' + LETRAS[pos] + '</span><span>' + esc(q.ops[oi][0]) + '</span></button>'; }).join("") + '</div>';
    if (dm.fb) h += '<div class="fb ' + (r.ok ? "ok" : "no") + '" role="status"><h3 tabindex="-1">' + (r.ok ? I.ok + " Correcto" : I.no + " Incorrecto") + '</h3><p style="margin:0">' + (r.ok ? "" : '<b>Respuesta correcta:</b> ' + esc(q.ops[0][0]) + '. ') + esc(q.exp) + '</p></div>' +
      '<div class="acciones"><button class="btn btn-t" id="bDsig">' + (dm.i === mi.dominio.length - 1 ? "Ver resultado" : "Siguiente pregunta") + '</button></div>';
    else h += '<div class="acciones"><button class="btn btn-p" id="bDconf"' + (dm.sel == null ? " disabled" : "") + '>Confirmar respuesta</button></div>';
  }
  h += '</div>';
  app().innerHTML = h;
  app().querySelectorAll(".op[data-o]").forEach((b) => b.onclick = () => { dm.sel = +b.dataset.o; guardar(); render(); });
  const q = (s, f) => { const e = $(s); if (e) e.onclick = f; };
  q("#bDconf", () => { dm.resp[dm.i] = { sel: dm.sel, ok: dm.sel === 0 }; dm.fb = true; dm.mejor = Math.max(dm.mejor || 0, dm.resp.filter((x) => x.ok).length); guardar(); render(); setTimeout(enfocarFb, 20); });
  q("#bDsig", () => { dm.i++; dm.fb = false; dm.sel = null; guardar(); render(); arriba(); });
  q("#bOtra", () => { dm.ronda++; dm.i = 0; dm.resp = []; dm.sel = null; dm.fb = false; guardar(); render(); arriba(); });
  q("#bRes", () => ir("resumen", { mid: mi.id })); q("#bMenu", () => ir("menu"));
  q("#bSigM", () => ir("intro", { mid: mi.id + 1 })); q("#bFinal", () => ir("final")); q("#bDescR", descargarRespaldo);
}

/* ---------- 10. DIAGNÓSTICO Y EVALUACIÓN FINAL ---------- */
function preguntaSecuencial(cfg) {
  // cfg: {kicker, titulo, items, estado(obj con i, resp, fb, sel), clave, conExp, alTerminar}
  const st = cfg.estado; const q = cfg.items[st.i]; const ops = q.ops.map((o) => Array.isArray(o) ? o[0] : o);
  const orden = perm(ops.length, cfg.clave + st.i); const r = st.resp[st.i]; const fb = st.fb;
  let h = '<div class="tarjeta"><div class="cabeza-d"><div><div class="kicker">' + cfg.kicker + '</div><span class="tipo">' + esc(q.tipo || ("AESP " + q.aesp)) + '</span></div>' +
    '<div class="tenue" style="font-weight:700">Pregunta ' + (st.i + 1) + ' de ' + cfg.items.length + '</div></div>' +
    '<div class="pbar" style="margin-bottom:1rem"><span style="width:' + Math.round(st.i / cfg.items.length * 100) + '%"></span></div>' +
    (q.esc ? cajaEscena(q.esc) : "") + '<div class="pregunta">' + esc(q.q) + '</div><div class="opciones">' +
    orden.map((oi, pos) => { let cls = "op"; if (!fb && st.sel === oi) cls += " sel"; if (fb) { if (oi === 0) cls += " bien"; else if (r && r.sel === oi) cls += " malo"; }
      return '<button class="' + cls + '" data-o="' + oi + '"' + (fb ? " disabled" : "") + '><span class="let">' + LETRAS[pos] + '</span><span>' + esc(ops[oi]) + '</span></button>'; }).join("") + '</div>';
  if (fb) h += '<div class="fb ' + (r.ok ? "ok" : "no") + '" role="status"><h3 tabindex="-1">' + (r.ok ? I.ok + " Correcto" : I.no + " Incorrecto") + '</h3><p style="margin:0">' + (r.ok ? "" : '<b>Respuesta correcta:</b> ' + esc(ops[0]) + '. ') + (q.exp ? esc(q.exp) : "") + '</p></div>' +
    '<div class="acciones"><button class="btn btn-t" id="bQsig">' + (st.i === cfg.items.length - 1 ? "Terminar" : "Siguiente pregunta") + '</button><button class="btn btn-s" id="bQsal">Guardar y salir al menú</button></div>';
  else h += '<div class="acciones"><button class="btn btn-p" id="bQconf"' + (st.sel == null ? " disabled" : "") + '>Confirmar respuesta</button><button class="btn btn-s" id="bQsal">Guardar y salir al menú</button></div>';
  h += '</div>';
  app().innerHTML = h;
  app().querySelectorAll(".op[data-o]").forEach((b) => b.onclick = () => { st.sel = +b.dataset.o; guardar(); render(); });
  const qq = (s, f) => { const e = $(s); if (e) e.onclick = f; };
  qq("#bQconf", () => { st.resp[st.i] = { sel: st.sel, ok: st.sel === 0 }; st.fb = true; guardar(); render(); setTimeout(enfocarFb, 20); });
  qq("#bQsig", () => { st.fb = false; st.sel = null; st.i++; if (st.i >= cfg.items.length) cfg.alTerminar(); else { guardar(); render(); arriba(); } });
  qq("#bQsal", () => ir("menu"));
}

    '<tr><th>Nivel de reconocimiento</th><td><span class="nivel ' + nv.c + '">' + nv.t + '</span></td></tr>' +
    '<tr><th>Puntos acumulados</th><td>' + fmt(ptsTotales()) + ' (misiones y bonificaciones: ' + fmt(ptsTotales() - ptsFinal()) + '; evaluación final: ' + fmt(ptsFinal()) + ')</td></tr>' +
    '<tr><th>Porcentaje de respuestas correctas</th><td>' + aciertosGlobales() + ' % (desafíos al primer intento y evaluación final)</td></tr>' +

    '</tbody></table><p class="tenue" style="font-size:.85rem;margin-top:.5rem">Resultado = promedio del desempeño en la misión y del porcentaje de aciertos de la AESP en la evaluación final.</p>' +
    '<div class="rejilla" style="margin-top:1rem"><div><h3>Fortalezas</h3>' + (fuertes.length ? '<ul class="lista-check">' + fuertes.map((f) => '<li>' + I.ok + '<span>' + f.mi.aesp + '. ' + esc(f.mi.corto || f.mi.titulo) + '</span></li>').join("") + '</ul>' : '<p class="tenue">Aún no hay AESP con resultado de 80 % o más.</p>') + '</div>' +

}

function respuestaSegura(d) {
  switch (d.tipo) {
    case "acertijo": case "primero": return esc(d.ops[0][0]) + ". " + esc(d.ops[0][1]);
    case "vf": return (d.ok ? "Verdadero. " : "Falso. ") + esc(d.exp);
    case "detecta": return "Acciones inseguras: " + d.items.filter((x) => x[1]).map((x) => "«" + esc(x[0]) + "»").join("; ");
    case "ordena": return "<ol>" + d.pasos.map((p) => "<li>" + esc(p) + "</li>").join("") + "</ol>";
    case "empareja": return "<ul>" + d.pares.map((p) => "<li>" + esc(p[0]) + " → " + esc(p[1]) + "</li>").join("") + "</ul>";
    case "caso": return "<ol>" + d.pasos.map((p) => "<li>" + esc(p.ops.find((o) => o[1])[0]) + "</li>").join("") + "</ol>";
    case "reloj": return "<ul>" + d.items.map((x) => "<li>" + esc(x[0]) + " — <b>" + (x[1] ? "Verdadero" : "Falso") + "</b></li>").join("") + "</ul>";
  }
  return "";
}
function pantallaRevision() {
  const mid = S.pantalla.mid; let h;
  if (mid === 0) {
    if (!S.fin.hecho) return ir("menu");
    h = '<div class="tarjeta"><div class="kicker">Modo de revisión</div><h1>Evaluación final: sus respuestas</h1><table class="tabla"><thead><tr><th>#</th><th>Reactivo</th><th>Su respuesta</th><th>Respuesta correcta y explicación</th></tr></thead><tbody>' +
      EVALUACION.map((q, i) => { const r = S.fin.resp[i]; return '<tr><td>' + (i + 1) + '<br><small class="tenue">AESP ' + q.aesp + '</small></td><td>' + (q.esc ? esc(q.esc) + " " : "") + '<b>' + esc(q.q) + '</b></td><td>' + (r.ok ? "✔ " : "✘ ") + esc(q.ops[r.sel]) + '</td><td>' + esc(q.ops[0]) + '<br><span class="tenue">' + esc(q.exp) + '</span></td></tr>'; }).join("") +
      '</tbody></table><div class="acciones"><button class="btn btn-p" id="bVol">Volver al reporte</button></div></div>';
    app().innerHTML = h; $("#bVol").onclick = () => ir("reporte"); return;
  }
  const mi = MISIONES[mid - 1]; const m = M(mid);
  h = '<div class="tarjeta"><div class="kicker">Modo de revisión · Misión ' + mid + '</div><h1>' + esc(mi.titulo) + '</h1><table class="tabla"><thead><tr><th>Desafío</th><th>Resultado</th><th>Respuesta segura</th></tr></thead><tbody>' +
    mi.desafios.map((d, k) => { const r = m.res[k]; return '<tr><td><b>' + esc(d.titulo) + '</b><br><small class="tenue">' + TIPOS[d.tipo] + '</small></td><td>' + (r ? r.pts + '/' + r.max + ' pts' + (r.pista ? '<br><small>con pista</small>' : '') + (r.ok ? '<br><small>al primer intento</small>' : '') : "Pendiente") + '</td><td>' + (r ? respuestaSegura(d) : '<span class="tenue">Se muestra al resolver el desafío.</span>') + '</td></tr>'; }).join("") +
    '</tbody></table><div class="acciones"><button class="btn btn-p" id="bVol">Volver al menú</button></div></div>';
  app().innerHTML = h; $("#bVol").onclick = () => ir("menu");
}

function pantallaFuentes() {
  app().innerHTML = '<div class="tarjeta"><div class="kicker">Referencias</div><h1>Fuentes y referencias oficiales consultadas</h1><p class="tenue">Fecha de consulta: ' + FUENTES.consulta + '.</p><ol>' +
    FUENTES.lista.map((f) => '<li style="margin-bottom:.6rem">' + esc(f[0]) + '<br><a href="' + esc(f[1]) + '" target="_blank" rel="noopener noreferrer">' + esc(f[1]) + '</a></li>').join("") + '</ol>' +
    '<h2>Notas de verificación</h2><ul>' + FUENTES.notas.map((n) => '<li style="margin-bottom:.4rem">' + esc(n) + '</li>').join("") + '</ul>' +
    '<h3>Etiquetas de origen en las tarjetas de concepto</h3><div class="fila">' + Object.keys(FUENTE_ET).map((k) => '<span class="fuente f-' + k + '">' + FUENTE_ET[k] + '</span>').join("") + '</div>' +
    '<div class="acciones"><button class="btn btn-p" id="bVol">Volver</button></div></div>';
  $("#bVol").onclick = () => ir(S.fin.hecho ? "reporte" : "menu");
}

/* ---------- 12. MODALES ---------- */
function modal(titulo, cuerpo, alAbrir) {
  cerrarModal(); const v = document.createElement("div"); v.className = "velo"; v.id = "velo";
  v.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTit"><div class="cab"><h2 id="mTit" style="margin:0">' + titulo + '</h2><button class="btn-ico" id="mCerrar" aria-label="Cerrar">' + I.x + '<span>Cerrar</span></button></div><div id="mCuerpo">' + cuerpo + '</div></div>';
  document.body.appendChild(v); v.addEventListener("click", (e) => { if (e.target === v) cerrarModal(); });
  $("#mCerrar").onclick = cerrarModal; $("#mCerrar").focus(); if (alAbrir) alAbrir();
}
function cerrarModal() { const v = $("#velo"); if (v) v.remove(); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarModal(); });

function conceptosObtenidos() {
  const out = []; MISIONES.forEach((mi) => mi.desafios.forEach((d, k) => { if (S.m[mi.id] && S.m[mi.id].res[k]) out.push({ mi, c: d.concepto }); })); return out;
}
function abrirGlosario() {
  const lista = conceptosObtenidos();
  const pintar = (f) => {
    const t = (f || "").toLowerCase(); const filtrados = lista.filter((x) => !t || (x.c[0] + " " + x.c[1]).toLowerCase().includes(t));
    $("#gLista").innerHTML = filtrados.length ? filtrados.map((x) => '<div class="glos-item"><h4>' + esc(x.c[0]) + '</h4><p>' + esc(x.c[1]) + '</p><span class="fuente f-' + x.c[2] + '">' + FUENTE_ET[x.c[2]] + '</span> <small class="tenue">· Misión ' + x.mi.id + '</small></div>').join("")
      : '<p class="tenue">' + (lista.length ? "Ningún concepto coincide con la búsqueda." : "Aún no tiene conceptos. Cada desafío resuelto agrega una tarjeta a su glosario.") + '</p>';
  };
  modal("Glosario dinámico (" + lista.length + " de 72 conceptos)", '<label for="gBus">Buscar concepto</label><input type="text" id="gBus" placeholder="Por ejemplo: SAER, cuasifalla, doble verificación"><div id="gLista" style="margin-top:.8rem"></div>', () => {
    pintar(""); $("#gBus").addEventListener("input", (e) => pintar(e.target.value));
  });
}
function abrirAprendizajes() {
  const hechas = MISIONES.filter((mi) => S.m[mi.id] && Object.keys(S.m[mi.id].res).length >= 9);
  const cuerpo = hechas.length ? hechas.map((mi) => '<div class="glos-item"><h4>Misión ' + mi.id + '. ' + esc(mi.titulo) + '</h4><ul class="lista-check" style="margin-top:.4rem">' + mi.resumen.map((t) => '<li>' + I.ok + '<span>' + esc(t) + '</span></li>').join("") + '</ul></div>').join("")
    : '<p class="tenue">Aquí aparecerán los resúmenes de aprendizaje de cada misión que concluya.</p>';
  modal("Mis aprendizajes", cuerpo);
}
function confirmar(titulo, texto, boton, alAceptar) {
  modal(titulo, '<p>' + texto + '</p><div class="acciones"><button class="btn btn-peligro" id="mOk">' + esc(boton) + '</button><button class="btn btn-s" id="mNo">Cancelar</button></div>', () => {
    $("#mOk").onclick = () => { cerrarModal(); alAceptar(); }; $("#mNo").onclick = cerrarModal; $("#mNo").focus();
  });
}

/* ---------- 13. ARRANQUE ---------- */
document.addEventListener("DOMContentLoaded", () => {
  $("#bGlos").onclick = () => S && abrirGlosario();
  $("#bApr").onclick = () => S && abrirAprendizajes();
  $("#bMenuTop").onclick = () => S && ir("menu");
  ["star", "clock"].forEach((k) => { const e = document.querySelector("[data-ico=" + k + "]"); if (e) e.innerHTML = I[k]; });
  document.querySelectorAll("[data-icon]").forEach((e) => { e.insertAdjacentHTML("afterbegin", I[e.dataset.icon]); });
  $("#bGuardado").onclick = abrirRespaldo;
  S = null; // la bienvenida ofrece continuar la sesión guardada
  render();
  iniciarAlmacen().then(() => {
    // Si la cuenta tenía una copia más reciente, se replica en el navegador.
    const c = cargar(); if (c && ALM.nube === c) escribirLocal(c);
    if (!S) render(); else { guardar(); }
  });
  setInterval(tick, 1000);
  // Al ocultar o cerrar: se guarda el tiempo en el navegador y se envía a la cuenta solo un avance pendiente.
  window.addEventListener("pagehide", () => { if (S) { escribirLocal(S); escribirNubeAhora(); } });
  document.addEventListener("visibilitychange", () => { if (document.hidden && S) { escribirLocal(S); escribirNubeAhora(); } });
});

</script>
</body>
</html>
